name: Build QuestMate Items - Separate App

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. FIND THE EXISTING WORKING QUESTMATE APK
      #
      # First checks the repository.
      # If it is not there, finds the newest APK artifact.
      # ============================================================

      - name: Find QuestMate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input

          echo "=========================================="
          echo "Looking for existing QuestMate APK"
          echo "=========================================="

          # --------------------------------------------------------
          # First choice: APK in repository
          # --------------------------------------------------------

          if [ -f "QuestMate.apk" ]; then
            cp "QuestMate.apk" "input/QuestMate.apk"
            echo "Found QuestMate.apk in repository."
          else

            echo "No QuestMate.apk in repository."
            echo "Searching GitHub Actions artifacts..."

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              -o artifacts.json

            ARTIFACT_ID=$(jq -r '
              [
                .artifacts[]
                | select(.expired == false)
                | select(
                    (.name | ascii_downcase | contains("questmate"))
                    and
                    (.name | ascii_downcase | contains("apk"))
                )
              ]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' artifacts.json)

            ARTIFACT_NAME=$(jq -r --argjson id "${ARTIFACT_ID:-0}" '
              .artifacts[]
              | select(.id == $id)
              | .name // empty
            ' artifacts.json)

            if [ -z "$ARTIFACT_ID" ]; then
              echo ""
              echo "ERROR: No QuestMate APK artifact was found."
              echo ""
              echo "Put the working QuestMate.apk in the repository root"
              echo "and run this workflow again."
              exit 1
            fi

            echo ""
            echo "Using artifact:"
            echo "$ARTIFACT_NAME"
            echo "Artifact ID:"
            echo "$ARTIFACT_ID"
            echo ""

            curl -fsSL \
              -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o input/artifact.zip

            mkdir -p input/extracted

            unzip -o \
              input/artifact.zip \
              -d input/extracted

            FOUND_APK=$(find input/extracted \
              -type f \
              -iname "*.apk" \
              | head -n 1)

            if [ -z "$FOUND_APK" ]; then
              echo "ERROR: Artifact did not contain an APK."
              find input/extracted -type f -print
              exit 1
            fi

            cp "$FOUND_APK" input/QuestMate.apk

          fi

          echo ""
          echo "Source APK:"
          ls -lh input/QuestMate.apk


      # ============================================================
      # 4. INSTALL APKTOOL
      #
      # Apktool 3.0.3 is used to decode the manifest while leaving
      # the existing DEX files untouched.
      # ============================================================

      - name: Install Apktool 3.0.3
        run: |
          set -e

          curl -fsSL \
            -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"

          echo "Apktool downloaded."

          java -jar apktool.jar --version


      # ============================================================
      # 5. DECODE APK
      #
      # --no-src:
      #   Keeps the existing compiled Java/Dex code untouched.
      #
      # --no-res:
      #   Keeps the original resource table intact.
      #
      # This makes the modification much safer for this APK.
      # ============================================================

      - name: Decode QuestMate
        run: |
          set -e

          rm -rf work

          mkdir -p work

          java -jar apktool.jar d \
            --no-src \
            --no-res \
            --force \
            input/QuestMate.apk \
            -o work/questmate

          echo ""
          echo "APK decoded."

          echo ""
          echo "Decoded files:"
          find work/questmate -maxdepth 2 -type f | sort


      # ============================================================
      # 6. CHECK THE QUEST DATABASE
      # ============================================================

      - name: Check quest database
        run: |
          set -e

          if [ ! -f "work/questmate/assets/quests.json" ]; then
            echo "ERROR:"
            echo "assets/quests.json was not found."
            echo ""
            echo "Files in assets:"
            find work/questmate/assets -maxdepth 2 -type f -print
            exit 1
          fi

          echo "quests.json found."

          python3 -m json.tool \
            work/questmate/assets/quests.json \
            > /dev/null

          echo "quests.json is valid JSON."


      # ============================================================
      # 7. COMPILE ITEMS FOR EVERY QUEST
      #
      # Existing walkthrough steps are NOT deleted.
      #
      # Existing top-level items are preserved when useful.
      #
      # Duplicate items are removed.
      # ============================================================

      - name: Compile quest item lists
        run: |

          cat > work/compile_items.py <<'PY'
          import json
          import re

          INPUT = "work/questmate/assets/quests.json"

          with open(INPUT, "r", encoding="utf-8") as f:
              quests = json.load(f)

          item_words = [
              "gear",
              "equipment",
              "food",
              "runes",
              "rune",
              "teleport",
              "teleports",
              "necklace",
              "amulet",
              "talisman",
              "staff",
              "axe",
              "pickaxe",
              "harpoon",
              "spade",
              "hammer",
              "bucket",
              "jug",
              "vial",
              "potion",
              "antipoison",
              "antifire",
              "anti-fire",
              "weapon",
              "armour",
              "armor",
              "boots",
              "gloves",
              "cape",
              "ring",
              "shield",
              "helmet",
              "hat",
              "bow",
              "crossbow",
              "arrows",
              "arrow",
              "bolts",
              "bolt",
              "ammo",
              "ammunition",
              "dagger",
              "sword",
              "scimitar",
              "mace",
              "spear",
              "rod",
              "rods",
              "rope",
              "coins",
              "coin",
              "logs",
              "log",
              "coal",
              "ore",
              "knife",
              "needle",
              "thread",
              "chisel",
              "tinderbox",
              "lantern",
              "candle",
              "torch",
              "pot",
              "potato",
              "cake",
              "meat",
              "shark",
              "lobster",
              "monkfish",
              "karambwan",
              "prayer potion",
              "super restore",
              "stamina",
              "energy potion",
              "strength potion",
              "combat potion",
              "ranging potion",
              "magic potion",
              "teleport",
              "tablet",
              "tablets",
              "fairy ring",
              "skills necklace",
              "games necklace",
              "ring of dueling",
              "xeric",
              "kharedst",
          ]

          action_starts = [
              "talk ",
              "speak ",
              "search ",
              "enter ",
              "kill ",
              "fight ",
              "cast ",
              "read ",
              "open ",
              "chop ",
              "solve ",
              "inspect ",
              "watch ",
              "return ",
              "go ",
              "travel ",
              "pickpocket ",
              "use ",
              "take ",
              "buy ",
              "mine ",
              "cook ",
              "light ",
              "climb ",
              "equip ",
              "withdraw ",
              "bank ",
              "dig ",
              "cut ",
              "complete ",
              "finish ",
              "start ",
              "locate ",
              "investigate ",
              "collect ",
              "pick ",
              "loot ",
              "head ",
              "walk ",
              "run ",
              "teleport to ",
              "head to ",
              "make your way ",
              "proceed ",
              "leave ",
              "defeat ",
          ]

          def clean(text):
              text = str(text).strip()
              text = re.sub(r"\s+", " ", text)
              return text

          def key(text):
              text = clean(text).lower()
              text = re.sub(r"[.!?,;:]+$", "", text)
              return text

          def is_action(text):
              low = text.lower().strip()

              for start in action_starts:
                  if low.startswith(start):
                      return True

              return False

          def looks_like_item(text):
              text = clean(text)

              if not text:
                  return False

              if is_action(text):
                  return False

              low = text.lower()

              obvious = [
                  "any ",
                  "decent food",
                  "melee combat gear",
                  "ranged combat gear",
                  "magic combat gear",
                  "combat gear",
                  "melee or range gear",
                  "ranged or melee gear",
                  "melee or magic gear",
                  "magic or range gear",
                  "gear to",
                  "equipment to",
                  "runes/equipment",
                  "bring ",
                  "have ",
                  "bring at least ",
                  "you will need ",
                  "you'll need ",
                  "needed:",
                  "required:",
                  "recommended:",
                  "requires ",
              ]

              for phrase in obvious:
                  if low.startswith(phrase):
                      return True

              for word in item_words:
                  if word in low:
                      return True

              return False

          def add_item(items, value):
              value = clean(value)

              if not value:
                  return

              value = re.sub(r"[.!]+$", "", value).strip()

              ignored = {
                  "see walkthrough",
                  "see quest walkthrough",
                  "none",
                  "n/a",
              }

              if key(value) in ignored:
                  return

              existing = {key(x) for x in items}

              if key(value) not in existing:
                  items.append(value)

          for quest in quests:

              compiled = []

              # Preserve useful existing item entries.
              existing_items = quest.get("items", [])

              if isinstance(existing_items, list):

                  for item in existing_items:

                      if isinstance(item, str):

                          if key(item) not in {
                              "see walkthrough",
                              "see quest walkthrough",
                              "none",
                              "n/a",
                          }:
                              add_item(compiled, item)

              # Scan the walkthrough.
              walkthrough = quest.get("walkthrough", [])

              if isinstance(walkthrough, list):

                  for section in walkthrough:

                      if not isinstance(section, dict):
                          continue

                      steps = section.get("steps", [])

                      if not isinstance(steps, list):
                          continue

                      for step in steps:

                          if not isinstance(step, str):
                              continue

                          step = clean(step)

                          if looks_like_item(step):
                              add_item(compiled, step)

              if not compiled:
                  compiled = ["See walkthrough"]

              quest["items"] = compiled

          with open(INPUT, "w", encoding="utf-8") as f:
              json.dump(
                  quests,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("")
          print("========================================")
          print("COMPILED QUEST ITEMS")
          print("========================================")

          for quest in quests[:15]:

              print("")
              print(quest.get("title", "Unknown quest"))

              for item in quest.get("items", []):
                  print("  -", item)

          print("")
          print("========================================")
          PY

          python3 work/compile_items.py

          python3 -m json.tool \
            work/questmate/assets/quests.json \
            > /dev/null


      # ============================================================
      # 8. PATCH MANIFEST
      #
      # ORIGINAL:
      #   com.questmate.app
      #
      # NEW:
      #   com.questmate.items
      #
      # This makes Android treat it as a completely separate app.
      # ============================================================

      - name: Create separate QuestMate Items package
        run: |

          python3 - <<'PY'
          import re

          path = "work/questmate/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # --------------------------------------------------------
          # Detect original package.
          # --------------------------------------------------------

          match = re.search(
              r'<manifest\b[^>]*\bpackage="([^"]+)"',
              text
          )

          if not match:
              raise SystemExit(
                  "Could not find package name in AndroidManifest.xml"
              )

          old_package = match.group(1)

          print("Original package:")
          print(old_package)

          new_package = "com.questmate.items"

          # --------------------------------------------------------
          # Change ONLY the manifest package attribute.
          #
          # We intentionally do not rename Java classes because
          # the existing MainActivity remains in:
          #
          # com.questmate.app.MainActivity
          # --------------------------------------------------------

          text = re.sub(
              r'(<manifest\b[^>]*\bpackage=")[^"]+(")',
              r'\g<1>' + new_package + r'\g<2>',
              text,
              count=1
          )

          # --------------------------------------------------------
          # Make common package-based Android authorities unique.
          # --------------------------------------------------------

          attributes = [
              "authorities",
              "taskAffinity",
              "permission",
              "readPermission",
              "writePermission",
          ]

          for attribute in attributes:

              pattern = (
                  r'('
                  + re.escape(attribute)
                  + r'=")'
                  + re.escape(old_package)
              )

              text = re.sub(
                  pattern,
                  r'\g<1>' + new_package,
                  text
              )

          # --------------------------------------------------------
          # Give the separate app its own visible name.
          # --------------------------------------------------------

          application_pattern = (
              r'(<application\b[^>]*\bandroid:label=")[^"]+(")'
          )

          if re.search(application_pattern, text):

              text = re.sub(
                  application_pattern,
                  r'\g<1>QuestMate Items\g<2>',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  "<application",
                  '<application android:label="QuestMate Items"',
                  1
              )

          # --------------------------------------------------------
          # Use a higher version code for the test app.
          # --------------------------------------------------------

          text = re.sub(
              r'(android:versionCode=")\d+(")',
              r'\g<1>3001\g<2>',
              text,
              count=1
          )

          # --------------------------------------------------------
          # Change displayed version.
          # --------------------------------------------------------

          text = re.sub(
              r'(android:versionName=")[^"]+(")',
              r'\g<1>3.0-items\g<2>',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("")
          print("New application ID:")
          print(new_package)

          print("")
          print("Application label:")
          print("QuestMate Items")

          print("")
          print("Manifest patched successfully.")
          PY


      # ============================================================
      # 9. SHOW MANIFEST
      # ============================================================

      - name: Verify separate package
        run: |
          set -e

          echo ""
          echo "===== PATCHED MANIFEST ====="

          sed -n '1,120p' \
            work/questmate/AndroidManifest.xml

          echo ""
          echo "============================"


      # ============================================================
      # 10. BUILD MODIFIED APK
      # ============================================================

      - name: Rebuild QuestMate Items APK
        run: |
          set -e

          mkdir -p output

          java -jar apktool.jar b \
            work/questmate \
            -o output/QuestMate-Items-unsigned.apk

          echo ""
          echo "APK rebuilt."

          ls -lh output/QuestMate-Items-unsigned.apk


      # ============================================================
      # 11. INSTALL ANDROID BUILD TOOLS
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "build-tools;36.0.0"


      # ============================================================
      # 12. ZIPALIGN
      # ============================================================

      - name: Zipalign APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            output/QuestMate-Items-unsigned.apk \
            output/QuestMate-Items-aligned.apk

          echo "APK aligned."


      # ============================================================
      # 13. FIND EXISTING TEST SIGNING KEY
      #
      # This prevents later runs from creating a different signing
      # key for the same separate package.
      # ============================================================

      - name: Find existing QuestMate Items signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          set -e

          mkdir -p signing

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            -o signing/artifacts.json

          KEY_ARTIFACT_ID=$(jq -r '
            [
              .artifacts[]
              | select(.expired == false)
              | select(.name == "QuestMate-Items-Signing-Key")
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' signing/artifacts.json)

          if [ -n "$KEY_ARTIFACT_ID" ]; then

            echo "Existing signing key artifact found."

            curl -fsSL \
              -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${KEY_ARTIFACT_ID}/zip" \
              -o signing/key.zip

            mkdir -p signing/extracted

            unzip -o \
              signing/key.zip \
              -d signing/extracted

            FOUND_KEY=$(find signing/extracted \
              -type f \
              -name "*.keystore" \
              | head -n 1)

            if [ -z "$FOUND_KEY" ]; then
              echo "Existing artifact did not contain a keystore."
              exit 1
            fi

            cp "$FOUND_KEY" signing/questmate-items.keystore

            echo "Existing signing key restored."

          else

            echo "No existing signing key found."
            echo "Generating first test signing key."

            keytool \
              -genkeypair \
              -v \
              -keystore signing/questmate-items.keystore \
              -alias questmateitems \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass questmateitems123 \
              -keypass questmateitems123 \
              -dname \
              "CN=QuestMate Items, OU=QuestMate, O=QuestMate, L=Brisbane, ST=QLD, C=AU"

            echo "New signing key generated."

          fi


      # ============================================================
      # 14. SIGN
      # ============================================================

      - name: Sign QuestMate Items APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks signing/questmate-items.keystore \
            --ks-pass pass:questmateitems123 \
            --key-pass pass:questmateitems123 \
            --ks-key-alias questmateitems \
            --out output/QuestMate-Items.apk \
            output/QuestMate-Items-aligned.apk

          echo ""
          echo "APK signed."


      # ============================================================
      # 15. VERIFY APK
      # ============================================================

      - name: Verify APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            output/QuestMate-Items.apk

          echo ""
          echo "APK signature verified."


      # ============================================================
      # 16. VERIFY PACKAGE NAME
      # ============================================================

      - name: Verify final package
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging \
            output/QuestMate-Items.apk \
            | head -n 5

          echo ""
          echo "Expected package:"
          echo "com.questmate.items"


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================

      - name: Upload QuestMate Items APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-Items-Separate-App
          path: output/QuestMate-Items.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. SAVE TEST SIGNING KEY FOR FUTURE BUILDS
      #
      # This is NOT the original QuestMate production key.
      # It is only used so future QuestMate Items builds can update
      # the separate test app instead of causing another signature
      # mismatch.
      # ============================================================

      - name: Save QuestMate Items test signing key
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-Items-Signing-Key
          path: signing/questmate-items.keystore
          if-no-files-found: error
          retention-days: 90


      # ============================================================
      # 19. FINAL INFORMATION
      # ============================================================

      - name: Build complete
        run: |
          echo ""
          echo "=============================================="
          echo "        QUESTMATE ITEMS BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "APK:"
          ls -lh output/QuestMate-Items.apk
          echo ""
          echo "NEW APP PACKAGE:"
          echo "com.questmate.items"
          echo ""
          echo "NEW APP NAME:"
          echo "QuestMate Items"
          echo ""
          echo "This app is separate from the original QuestMate."
          echo ""
          echo "The original walkthrough item references remain."
          echo "The compiled Items list has been added."
          echo ""
          echo "=============================================="
