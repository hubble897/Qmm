name: QuestMate - Add Compiled Quest Items

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  update-quest-items:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Get repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install tools
      # ------------------------------------------------------------
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip zipalign

      # ------------------------------------------------------------
      # 3. Locate the newest QuestMate APK
      #
      # First checks for an APK already in the repository.
      # If none exists, downloads the newest non-expired APK
      # artifact from GitHub Actions.
      # ------------------------------------------------------------
      - name: Locate existing QuestMate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input

          echo "Checking repository for QuestMate.apk..."

          if [ -f "QuestMate.apk" ]; then
            cp "QuestMate.apk" "input/QuestMate.apk"
            echo "Found QuestMate.apk in repository."
            exit 0
          fi

          echo "No QuestMate.apk in repository."
          echo "Searching previous GitHub Actions artifacts..."

          API_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            -o artifacts.json

          ARTIFACT_ID=$(jq -r '
            [
              .artifacts[]
              | select(.expired == false)
              | select(
                  (.name | ascii_downcase | contains("questmate"))
                  or
                  (.name | ascii_downcase | contains("apk"))
              )
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' artifacts.json)

          ARTIFACT_NAME=$(jq -r --argjson id "${ARTIFACT_ID:-0}" '
            .artifacts[]
            | select(.id == $id)
            | .name // empty
          ' artifacts.json)

          if [ -z "$ARTIFACT_ID" ]; then
            echo ""
            echo "ERROR: No previous APK artifact was found."
            echo ""
            echo "The workflow needs either:"
            echo "  1. A previous QuestMate APK artifact, or"
            echo "  2. QuestMate.apk placed in the repository root."
            echo ""
            echo "Your uploaded APK in ChatGPT cannot be directly accessed"
            echo "by GitHub Actions."
            exit 1
          fi

          echo "Using artifact:"
          echo "$ARTIFACT_NAME"
          echo "Artifact ID: $ARTIFACT_ID"

          curl -fsSL \
            -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o input/artifact.zip

          mkdir -p input/extracted

          unzip -o input/artifact.zip \
            -d input/extracted

          FOUND_APK=$(find input/extracted -type f -iname "*.apk" | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            echo "ERROR: The selected artifact did not contain an APK."
            find input/extracted -type f -print
            exit 1
          fi

          cp "$FOUND_APK" input/QuestMate.apk

          echo "Found APK:"
          ls -lh input/QuestMate.apk

      # ------------------------------------------------------------
      # 4. Inspect the APK
      # ------------------------------------------------------------
      - name: Check QuestMate APK
        run: |
          set -e

          echo "APK contents:"
          unzip -l input/QuestMate.apk

          echo ""
          echo "Checking for quest database..."

          if ! unzip -l input/QuestMate.apk | grep -q "assets/quests.json"; then
            echo "ERROR: assets/quests.json was not found."
            echo ""
            echo "This workflow is designed for the current QuestMate"
            echo "APK structure."
            exit 1
          fi

          echo "quests.json found."

      # ------------------------------------------------------------
      # 5. Extract quests.json
      # ------------------------------------------------------------
      - name: Extract quest database
        run: |
          set -e

          mkdir -p work

          unzip -p \
            input/QuestMate.apk \
            assets/quests.json \
            > work/quests.json

          python3 -m json.tool \
            work/quests.json \
            > /dev/null

          echo "Quest database is valid JSON."

      # ------------------------------------------------------------
      # 6. Compile item lists
      #
      # The original walkthrough is NOT removed or rewritten.
      #
      # This identifies preparation/item-style lines from each
      # walkthrough section and combines them into the quest's
      # top-level items list.
      # ------------------------------------------------------------
      - name: Compile required quest items
        run: |
          set -e

          cat > work/compile_items.py <<'PY'
          import json
          import re

          INPUT = "work/quests.json"
          OUTPUT = "work/quests_updated.json"

          with open(INPUT, "r", encoding="utf-8") as f:
              quests = json.load(f)

          # Words which strongly suggest that a line describes an
          # item, equipment, consumable, teleport, weapon, etc.
          item_words = [
              "gear",
              "equipment",
              "food",
              "runes",
              "rune",
              "teleport",
              "teleports",
              "necklace",
              "amulet",
              "talisman",
              "staff",
              "axe",
              "pickaxe",
              "harpoon",
              "spade",
              "hammer",
              "bucket",
              "jug",
              "vial",
              "potion",
              "antipoison",
              "antifire",
              "anti-fire",
              "weapon",
              "armour",
              "armor",
              "boots",
              "gloves",
              "cape",
              "ring",
              "shield",
              "helmet",
              "hat",
              "bow",
              "crossbow",
              "arrows",
              "arrow",
              "bolts",
              "bolt",
              "ammo",
              "ammunition",
              "dagger",
              "sword",
              "scimitar",
              "mace",
              "spear",
              "staff",
              "rods",
              "rod",
              "rope",
              "coins",
              "coin",
              "logs",
              "log",
              "coal",
              "ore",
              "knife",
              "needle",
              "thread",
              "hammer",
              "chisel",
              "tinderbox",
              "lantern",
              "candle",
              "torch",
              "pot",
              "potato",
              "cake",
              "meat",
              "shark",
              "lobster",
              "monkfish",
              "karambwan",
              "prayer potion",
              "super restore",
              "stamina",
              "energy potion",
              "strength potion",
              "combat potion",
              "ranging potion",
              "magic potion",
              "teleport",
              "tablet",
              "tablets",
              "fairy ring",
              "skills necklace",
              "games necklace",
              "ring of dueling",
              "xeric",
              "kharedst",
          ]

          # Lines which are clearly instructions rather than
          # preparation requirements.
          action_starts = [
              "talk ",
              "speak ",
              "search ",
              "enter ",
              "kill ",
              "fight ",
              "cast ",
              "read ",
              "open ",
              "chop ",
              "solve ",
              "inspect ",
              "watch ",
              "return ",
              "go ",
              "travel ",
              "pickpocket ",
              "use ",
              "take ",
              "buy ",
              "mine ",
              "cook ",
              "light ",
              "climb ",
              "equip ",
              "withdraw ",
              "bank ",
              "dig ",
              "cut ",
              "complete ",
              "finish ",
              "start ",
              "locate ",
              "investigate ",
              "collect ",
              "pick ",
              "loot ",
              "head ",
              "walk ",
              "run ",
              "teleport to ",
              "head to ",
              "make your way ",
              "proceed ",
              "leave ",
              "kill the ",
              "defeat ",
              "defeat the ",
          ]

          def clean(text):
              text = str(text).strip()
              text = re.sub(r"\s+", " ", text)
              return text

          def normal_key(text):
              text = text.lower().strip()
              text = re.sub(r"[.!?,;:]+$", "", text)
              text = re.sub(r"\s+", " ", text)
              return text

          def is_action(text):
              low = text.lower().strip()

              for start in action_starts:
                  if low.startswith(start):
                      return True

              return False

          def looks_like_item(text):
              text = clean(text)

              if not text:
                  return False

              if is_action(text):
                  return False

              low = text.lower()

              # Obvious preparation wording.
              if low.startswith("any "):
                  return True

              if low.startswith("decent food"):
                  return True

              if low.startswith("melee combat gear"):
                  return True

              if low.startswith("ranged combat gear"):
                  return True

              if low.startswith("magic combat gear"):
                  return True

              if low.startswith("combat gear"):
                  return True

              if low.startswith("melee or range gear"):
                  return True

              if low.startswith("ranged or melee gear"):
                  return True

              if low.startswith("melee or magic gear"):
                  return True

              if low.startswith("magic or range gear"):
                  return True

              if low.startswith("gear to"):
                  return True

              if low.startswith("equipment to"):
                  return True

              if low.startswith("runes/equipment"):
                  return True

              # Explicit item terminology.
              for word in item_words:
                  if word in low:
                      return True

              # Preparation-style phrases.
              prep_patterns = [
                  r"^bring ",
                  r"^have ",
                  r"^bring at least ",
                  r"^you will need ",
                  r"^you'll need ",
                  r"^needed:",
                  r"^required:",
                  r"^recommended:",
                  r"^requires ",
              ]

              for pattern in prep_patterns:
                  if re.search(pattern, low):
                      return True

              return False

          def add_item(items, value):
              value = clean(value)

              if not value:
                  return

              # Strip trailing punctuation for cleaner display.
              value = re.sub(r"[.!]+$", "", value).strip()

              key = normal_key(value)

              # Ignore generic non-item placeholders.
              ignored = {
                  "see walkthrough",
                  "see quest walkthrough",
                  "none",
                  "n/a",
              }

              if key in ignored:
                  return

              # Avoid duplicate entries while retaining the original
              # wording of the first occurrence.
              existing_keys = {normal_key(x) for x in items}

              if key not in existing_keys:
                  items.append(value)

          for quest in quests:

              compiled = []

              # Preserve any genuine existing top-level items.
              existing = quest.get("items", [])

              if isinstance(existing, list):
                  for item in existing:
                      if isinstance(item, str):
                          if normal_key(item) not in (
                              "see walkthrough",
                              "see quest walkthrough",
                              "none",
                              "n/a",
                          ):
                              add_item(compiled, item)

              # Walk through every walkthrough section.
              walkthrough = quest.get("walkthrough", [])

              if isinstance(walkthrough, list):
                  for section in walkthrough:

                      if not isinstance(section, dict):
                          continue

                      steps = section.get("steps", [])

                      if not isinstance(steps, list):
                          continue

                      for step in steps:

                          if not isinstance(step, str):
                              continue

                          step = clean(step)

                          if looks_like_item(step):
                              add_item(compiled, step)

              # If we found nothing, retain the existing placeholder
              # rather than creating a misleading empty list.
              if not compiled:
                  compiled = ["See walkthrough"]

              quest["items"] = compiled

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  quests,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("Updated quest database.")

          for quest in quests[:10]:
              print("")
              print(quest.get("title", "Unknown quest"))
              print("Items:")
              for item in quest.get("items", []):
                  print(" -", item)
          PY

          python3 work/compile_items.py

          python3 -m json.tool \
            work/quests_updated.json \
            > /dev/null

          echo ""
          echo "Quest database successfully updated."

      # ------------------------------------------------------------
      # 7. Show examples before rebuilding
      # ------------------------------------------------------------
      - name: Verify compiled items
        run: |
          python3 - <<'PY'
          import json

          with open("work/quests_updated.json", encoding="utf-8") as f:
              quests = json.load(f)

          print("")
          print("===== COMPILED QUEST ITEMS =====")

          for quest in quests[:20]:
              print("")
              print(quest.get("title", "Unknown"))
              for item in quest.get("items", []):
                  print("  •", item)

          print("")
          print("================================")
          PY

      # ------------------------------------------------------------
      # 8. Rebuild APK
      #
      # Everything except assets/quests.json is copied from the
      # existing working APK.
      # ------------------------------------------------------------
      - name: Rebuild patched APK
        run: |
          set -e

          rm -rf work/apk
          mkdir -p work/apk

          unzip -q input/QuestMate.apk -d work/apk

          cp \
            work/quests_updated.json \
            work/apk/assets/quests.json

          # Remove old APK signatures because the APK contents changed.
          rm -rf work/apk/META-INF

          cd work/apk

          zip -q -r \
            ../../QuestMate-unsigned.apk \
            .

          cd ../..

          echo "Unsigned APK created:"
          ls -lh QuestMate-unsigned.apk

      # ------------------------------------------------------------
      # 9. Install Android build tools
      # ------------------------------------------------------------
      - name: Install Android SDK build tools
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 10. Zipalign
      # ------------------------------------------------------------
      - name: Zipalign APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -p 4 \
            QuestMate-unsigned.apk \
            QuestMate-aligned.apk

          echo "APK aligned."

      # ------------------------------------------------------------
      # 11. Create signing key
      #
      # This creates a new signing key for this rebuilt APK.
      # It is suitable for installing/testing the APK.
      # ------------------------------------------------------------
      - name: Create test signing key
        run: |
          set -e

          keytool \
            -genkeypair \
            -v \
            -keystore questmate-test.keystore \
            -alias questmate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass questmate123 \
            -keypass questmate123 \
            -dname "CN=QuestMate, OU=QuestMate, O=QuestMate, L=Brisbane, ST=QLD, C=AU"

          echo "Signing key created."

      # ------------------------------------------------------------
      # 12. Sign APK
      # ------------------------------------------------------------
      - name: Sign APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks questmate-test.keystore \
            --ks-pass pass:questmate123 \
            --key-pass pass:questmate123 \
            --ks-key-alias questmate \
            --out QuestMate-Items-Updated.apk \
            QuestMate-aligned.apk

          echo "Signed APK created."

      # ------------------------------------------------------------
      # 13. Verify APK signature
      # ------------------------------------------------------------
      - name: Verify signed APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            QuestMate-Items-Updated.apk

          echo ""
          echo "APK signature verified."

      # ------------------------------------------------------------
      # 14. Final APK information
      # ------------------------------------------------------------
      - name: Show final APK
        run: |
          echo ""
          echo "=========================================="
          echo "        QUESTMATE BUILD COMPLETE"
          echo "=========================================="
          echo ""
          ls -lh QuestMate-Items-Updated.apk
          echo ""
          echo "The compiled Items section has been added."
          echo "The original walkthrough steps were preserved."
          echo ""

      # ------------------------------------------------------------
      # 15. Upload final APK artifact
      # ------------------------------------------------------------
      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-Items-Updated
          path: QuestMate-Items-Updated.apk
          if-no-files-found: error
          retention-days: 30
