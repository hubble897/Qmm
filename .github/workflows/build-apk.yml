                          "teleport",
                          "teleports",
                          "a ",
                          "an ",
                          "some "
                  };


                  for (String prefix : prefixes) {

                      if (s.startsWith(prefix)) {
                          return true;
                      }
                  }


                  String[] keywords = {
                          "gear",
                          "equipment",
                          "food",
                          "runes",
                          "teleport",
                          "necklace",
                          "amulet",
                          "talisman",
                          "staff",
                          "axe",
                          "pickaxe",
                          "harpoon",
                          "spade",
                          "hammer",
                          "bucket",
                          "jug",
                          "vial",
                          "potion",
                          "antipoison",
                          "antifire",
                          "weapon",
                          "armour",
                          "armor",
                          "boots",
                          "gloves",
                          "cape",
                          "ring",
                          "shield",
                          "helmet",
                          "hat",
                          "bow",
                          "crossbow",
                          "arrows",
                          "arrow",
                          "bolts",
                          "bolt",
                          "ammo",
                          "dagger",
                          "sword",
                          "scimitar",
                          "mace",
                          "spear",
                          "rod",
                          "rope",
                          "coins",
                          "coin",
                          "logs",
                          "log",
                          "coal",
                          "ore",
                          "knife",
                          "needle",
                          "thread",
                          "chisel",
                          "tinderbox",
                          "lantern",
                          "candle",
                          "torch",
                          "pot",
                          "cake",
                          "milk",
                          "meat",
                          "shark",
                          "lobster",
                          "monkfish",
                          "karambwan",
                          "restore",
                          "stamina",
                          "tablet",
                          "xeric",
                          "kharedst",
                          "cat",
                          "flail",
                          "shears",
                          "seeds",
                          "seed"
                  };


                  for (String keyword : keywords) {

                      if (s.contains(keyword)) {
                          return true;
                      }
                  }


                  return false;
              }


              // ======================================================
              // STRONG ITEM LINE
              // ======================================================
              private boolean isStrongItemLine(
                      String step
              ) {

                  String s =
                          step.toLowerCase(
                                  Locale.ROOT
                          );


                  String[] strong = {
                          "bring ",
                          "take ",
                          "equip ",
                          "wear ",
                          "wield ",
                          "use ",
                          "carry ",
                          "have ",
                          "obtain ",
                          "get ",
                          "buy ",
                          "grab ",
                          "bank ",
                          "withdraw ",
                          "inventory",
                          "runes",
                          "food",
                          "gear",
                          "equipment",
                          "potion",
                          "teleport",
                          "amulet",
                          "necklace",
                          "ring",
                          "weapon",
                          "armour",
                          "armor"
                  };


                  for (String keyword : strong) {

                      if (s.contains(keyword)) {
                          return true;
                      }
                  }


                  return false;
              }


              // ======================================================
              // ITEM STEP
              // ======================================================
              private boolean isItemStep(
                      String step
              ) {

                  if (step == null
                          || step.trim().isEmpty()) {
                      return false;
                  }

                  return looksLikePreparation(step)
                          || isStrongItemLine(step);
              }


              // ======================================================
              // USEFUL ITEM LINE
              // ======================================================
              private boolean isUsefulItemLine(
                      String value
              ) {

                  if (value == null) {
                      return false;
                  }

                  String s =
                          value.trim();

                  if (s.isEmpty()) {
                      return false;
                  }

                  if (s.equalsIgnoreCase(
                          "See walkthrough"
                  )) {
                      return false;
                  }

                  if (s.equalsIgnoreCase(
                          "See quest walkthrough"
                  )) {
                      return false;
                  }

                  return true;
              }


              // ======================================================
              // ACTION DETECTOR
              // ======================================================
              private boolean startsWithAction(
                      String step
              ) {

                  String s =
                          step.toLowerCase(
                                  Locale.ROOT
                          );


                  String[] actions = {
                          "talk to ",
                          "speak to ",
                          "speak with ",
                          "go to ",
                          "travel to ",
                          "walk to ",
                          "enter ",
                          "leave ",
                          "climb ",
                          "search ",
                          "open ",
                          "close ",
                          "kill ",
                          "fight ",
                          "attack ",
                          "use ",
                          "pickpocket ",
                          "mine ",
                          "fish ",
                          "cut ",
                          "chop ",
                          "cook ",
                          "bury ",
                          "dig ",
                          "read ",
                          "look ",
                          "return ",
                          "head to ",
                          "teleport to "
                  };


                  for (String action : actions) {

                      if (s.startsWith(action)) {
                          return true;
                      }
                  }


                  return false;
              }
          }
