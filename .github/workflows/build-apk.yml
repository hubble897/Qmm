name: Build QuestMate APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create QuestMate project
        run: |
          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#66BB6A</item>
                  <item name="android:navigationBarColor">#10131A</item>
                  <item name="android:statusBarColor">#10131A</item>
              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final String MAPPING_URL =
                      "https://prices.runescape.wiki/api/v1/osrs/mapping";

              private static final String LATEST_URL =
                      "https://prices.runescape.wiki/api/v1/osrs/latest";

              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor();

              private TextView resultText;
              private EditText itemSearch;
              private Button priceButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 40, 24, 24);
                  root.setBackgroundColor(Color.rgb(16, 19, 26));

                  TextView title = new TextView(this);
                  title.setText("QuestMate");
                  title.setTextSize(34);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("OSRS Quest & Item Companion");
                  subtitle.setTextSize(17);
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setGravity(Gravity.CENTER);
                  subtitle.setPadding(0, 10, 0, 24);

                  Button questButton = new Button(this);
                  questButton.setText("QUEST GUIDE");
                  questButton.setOnClickListener(v -> showQuestGuide());

                  itemSearch = new EditText(this);
                  itemSearch.setHint("Search OSRS item...");
                  itemSearch.setSingleLine(true);
                  itemSearch.setTextColor(Color.WHITE);
                  itemSearch.setHintTextColor(Color.GRAY);

                  priceButton = new Button(this);
                  priceButton.setText("CHECK OSRS PRICE");
                  priceButton.setOnClickListener(v -> checkPrice());

                  resultText = new TextView(this);
                  resultText.setTextColor(Color.WHITE);
                  resultText.setTextSize(18);
                  resultText.setPadding(8, 24, 8, 8);
                  resultText.setText("Ready.");

                  root.addView(title);
                  root.addView(subtitle);
                  root.addView(questButton);
                  root.addView(itemSearch);
                  root.addView(priceButton);
                  root.addView(resultText);

                  setContentView(root);
              }

              private void showQuestGuide() {
                  String[] quests = {
                          "Cook's Assistant",
                          "The Restless Ghost",
                          "Sheep Shearer",
                          "Rune Mysteries",
                          "Romeo & Juliet"
                  };

                  new AlertDialog.Builder(this)
                          .setTitle("Quest Guide")
                          .setItems(quests,
                                  (dialog, which) ->
                                          showQuestDetails(quests[which]))
                          .setNegativeButton("Close", null)
                          .show();
              }

              private void showQuestDetails(String quest) {
                  String details;

                  switch (quest) {
                      case "Cook's Assistant":
                          details =
                                  "Start: Cook in Lumbridge Castle\n\n" +
                                  "Requirements: None\n\n" +
                                  "Bring the Cook an egg, a bucket of milk " +
                                  "and a pot of flour.";
                          break;

                      case "The Restless Ghost":
                          details =
                                  "Start: Father Aereck in the Lumbridge church\n\n" +
                                  "Requirements: None\n\n" +
                                  "Investigate the ghost and help it rest.";
                          break;

                      case "Sheep Shearer":
                          details =
                                  "Start: Farmer Fred near Lumbridge\n\n" +
                                  "Requirements: None\n\n" +
                                  "Shear 20 sheep and turn the wool into balls.";
                          break;

                      case "Rune Mysteries":
                          details =
                                  "Start: Duke Horacio in Lumbridge Castle\n\n" +
                                  "Requirements: None\n\n" +
                                  "Take the mysterious talisman to Sedridor.";
                          break;

                      default:
                          details =
                                  "Start: Romeo in Varrock\n\n" +
                                  "Requirements: None\n\n" +
                                  "Help Romeo and Juliet reunite.";
                          break;
                  }

                  new AlertDialog.Builder(this)
                          .setTitle(quest)
                          .setMessage(details)
                          .setPositiveButton("OK", null)
                          .show();
              }

              private void checkPrice() {
                  final String query =
                          itemSearch.getText().toString().trim();

                  if (query.isEmpty()) {
                      resultText.setText(
                              "Type an OSRS item name first.");
                      return;
                  }

                  priceButton.setEnabled(false);
                  resultText.setText(
                          "Looking up " + query + "...");

                  executor.execute(() -> {

                      try {
                          JSONArray mapping =
                                  new JSONArray(getJson(MAPPING_URL));

                          int itemId = -1;
                          String itemName = null;

                          String search =
                                  query.toLowerCase(Locale.US);

                          for (int i = 0;
                               i < mapping.length();
                               i++) {

                              JSONObject item =
                                      mapping.getJSONObject(i);

                              String name =
                                      item.optString("name", "");

                              if (name.equalsIgnoreCase(query)) {
                                  itemId =
                                          item.optInt("id", -1);
                                  itemName = name;
                                  break;
                              }
                          }

                          if (itemId == -1) {
                              for (int i = 0;
                                   i < mapping.length();
                                   i++) {

                                  JSONObject item =
                                          mapping.getJSONObject(i);

                                  String name =
                                          item.optString("name", "");

                                  if (name.toLowerCase(Locale.US)
                                          .contains(search)) {

                                      itemId =
                                              item.optInt("id", -1);

                                      itemName = name;
                                      break;
                                  }
                              }
                          }

                          if (itemId == -1) {
                              throw new Exception(
                                      "Item not found.");
                          }

                          String json =
                                  getJson(
                                          LATEST_URL +
                                          "?id=" +
                                          itemId);

                          JSONObject root =
                                  new JSONObject(json);

                          JSONObject data =
                                  root.getJSONObject("data");

                          JSONObject price =
                                  data.getJSONObject(
                                          String.valueOf(itemId));

                          int high =
                                  price.optInt("high", 0);

                          int low =
                                  price.optInt("low", 0);

                          final String message =
                                  itemName + "\n\n" +
                                  "High: " +
                                  formatGp(high) +
                                  " gp\n" +
                                  "Low: " +
                                  formatGp(low) +
                                  " gp";

                          runOnUiThread(() -> {
                              priceButton.setEnabled(true);
                              resultText.setText(message);
                          });

                      } catch (Exception e) {

                          final String message =
                                  "Price lookup failed:\n" +
                                  e.getMessage();

                          runOnUiThread(() -> {
                              priceButton.setEnabled(true);
                              resultText.setText(message);
                          });
                      }
                  });
              }

              private String getJson(String urlString)
                      throws Exception {

                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  new URL(urlString)
                                          .openConnection();

                  try {
                      connection.setRequestMethod("GET");
                      connection.setConnectTimeout(10000);
                      connection.setReadTimeout(15000);

                      connection.setRequestProperty(
                              "User-Agent",
                              "QuestMate/1.0");

                      int code =
                              connection.getResponseCode();

                      if (code !=
                              HttpURLConnection.HTTP_OK) {

                          throw new Exception(
                                  "HTTP " + code);
                      }

                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              connection
                                                      .getInputStream()));

                      StringBuilder result =
                              new StringBuilder();

                      String line;

                      while ((line =
                              reader.readLine()) != null) {

                          result.append(line);
                      }

                      reader.close();

                      return result.toString();

                  } finally {
                      connection.disconnect();
                  }
              }

              private String formatGp(int value) {
                  return String.format(
                          Locale.US,
                          "%,d",
                          value);
              }

              @Override
              protected void onDestroy() {
                  executor.shutdownNow();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle clean assembleDebug --stacktrace

          echo "Checking for APK..."
          ls -lah app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/QuestMate.apk

          echo "APK successfully created:"
          ls -lh dist/QuestMate.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
