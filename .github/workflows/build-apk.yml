              // ======================================================
              // ARRAY DISPLAY
              // ======================================================
              private void addArray(
                      LinearLayout parent,
                      JSONArray array
              ) {

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      String value =
                              array.optString(
                                      i,
                                      ""
                              ).trim();

                      if (value.isEmpty()) {
                          continue;
                      }

                      if (value.equalsIgnoreCase(
                              "See walkthrough"
                      )) {
                          continue;
                      }

                      if (value.equalsIgnoreCase(
                              "See quest walkthrough"
                      )) {
                          continue;
                      }

                      parent.addView(
                              text(
                                      "• " + value,
                                      15,
                                      Color.rgb(
                                              215,
                                              218,
                                              222
                                      )
                              )
                      );
                  }
              }


              // ======================================================
              // ITEM COMPILER
              //
              // Combines:
              // 1. Explicit quest items
              // 2. Preparation lines at the beginning of sections
              // 3. Item-related walkthrough lines
              //
              // Everything is deduplicated.
              // ======================================================
              private ArrayList<String> compileItems(
                      JSONObject quest
              ) {

                  Set<String> found =
                          new LinkedHashSet<>();


                  // --------------------------------------
                  // Explicit item field
                  // --------------------------------------
                  JSONArray explicit =
                          quest.optJSONArray(
                                  "items"
                          );

                  if (explicit != null) {

                      for (int i = 0;
                           i < explicit.length();
                           i++) {

                          String value =
                                  explicit.optString(
                                          i,
                                          ""
                                  ).trim();

                          if (isUsefulItemLine(value)) {
                              found.add(value);
                          }
                      }
                  }


                  // --------------------------------------
                  // Walkthrough
                  // --------------------------------------
                  JSONArray walkthrough =
                          quest.optJSONArray(
                                  "walkthrough"
                          );

                  if (walkthrough != null) {

                      for (int sectionIndex = 0;
                           sectionIndex < walkthrough.length();
                           sectionIndex++) {

                          JSONObject section =
                                  walkthrough.optJSONObject(
                                          sectionIndex
                                  );

                          if (section == null) {
                              continue;
                          }

                          JSONArray steps =
                                  section.optJSONArray(
                                          "steps"
                                  );

                          if (steps == null) {
                              continue;
                          }


                          boolean preparationFinished =
                                  false;


                          for (int i = 0;
                               i < steps.length();
                               i++) {

                              String step =
                                      steps.optString(
                                              i,
                                              ""
                                      ).trim();

                              if (step.isEmpty()) {
                                  continue;
                              }


                              if (!preparationFinished) {

                                  if (looksLikePreparation(step)) {

                                      found.add(step);

                                  } else if (startsWithAction(step)) {

                                      preparationFinished = true;

                                  } else if (isItemStep(step)) {

                                      found.add(step);

                                  } else {

                                      preparationFinished = true;
                                  }

                              } else {

                                  // Don't add every ordinary action.
                                  // Only add obvious item lines.
                                  if (isStrongItemLine(step)) {
                                      found.add(step);
                                  }
                              }
                          }
                      }
                  }


                  // --------------------------------------
                  // Remove generic database placeholders
                  // --------------------------------------
                  ArrayList<String> result =
                          new ArrayList<>();

                  for (String value : found) {

                      String lower =
                              value.toLowerCase(
                                      Locale.ROOT
                              );

                      if (lower.equals(
                              "see walkthrough"
                      )) {
                          continue;
                      }

                      if (lower.equals(
                              "see quest walkthrough"
                      )) {
                          continue;
                      }

                      if (value.length() > 2) {
                          result.add(value);
                      }
                  }

                  return result;
              }


              // ======================================================
              // PREPARATION DETECTOR
              // ======================================================
              private boolean looksLikePreparation(
                      String step
              ) {

                  String s =
                          step.toLowerCase(
                                  Locale.ROOT
                          );


                  String[] prefixes = {
                          "any ",
                          "decent ",
                          "bring ",
                          "have ",
