          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
package com.questmate.app;

import android.app.Activity;
import android.app.AlertDialog;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.view.Gravity;
import android.widget.Button;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStreamReader;
import java.net.HttpURLConnection;
import java.net.URL;
import java.util.Locale;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class MainActivity extends Activity {

    private final ExecutorService executor =
            Executors.newSingleThreadExecutor();

    private EditText itemSearch;
    private TextView priceResult;

    private static final String MAPPING_URL =
            "https://prices.runescape.wiki/api/v1/osrs/mapping";

    private static final String LATEST_URL =
            "https://prices.runescape.wiki/api/v1/osrs/latest";

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        buildScreen();
    }

    private void buildScreen() {

        ScrollView scroll = new ScrollView(this);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(25, 35, 25, 40);
        root.setBackgroundColor(Color.rgb(16, 19, 26));

        TextView title = new TextView(this);
        title.setText("QuestMate");
        title.setTextSize(38);
        title.setTypeface(null, Typeface.BOLD);
        title.setTextColor(Color.WHITE);
        title.setGravity(Gravity.CENTER);

        TextView version = new TextView(this);
        version.setText("VERSION 2.0 • FUNCTIONAL BUILD");
        version.setTextSize(14);
        version.setTextColor(Color.rgb(76, 175, 80));
        version.setGravity(Gravity.CENTER);
        version.setPadding(0, 5, 0, 5);

        TextView subtitle = new TextView(this);
        subtitle.setText("OSRS Quest & Item Companion");
        subtitle.setTextSize(17);
        subtitle.setTextColor(Color.LTGRAY);
        subtitle.setGravity(Gravity.CENTER);
        subtitle.setPadding(0, 5, 0, 30);

        Button questButton = new Button(this);
        questButton.setText("QUEST GUIDE");
        questButton.setTextSize(18);

        questButton.setOnClickListener(v -> {

            Toast.makeText(
                    MainActivity.this,
                    "Quest Guide opened!",
                    Toast.LENGTH_SHORT
            ).show();

            showQuestGuide();
        });

        TextView priceTitle = new TextView(this);
        priceTitle.setText("OSRS ITEM PRICE CHECKER");
        priceTitle.setTextSize(22);
        priceTitle.setTypeface(null, Typeface.BOLD);
        priceTitle.setTextColor(Color.WHITE);
        priceTitle.setPadding(0, 35, 0, 10);

        itemSearch = new EditText(this);
        itemSearch.setHint("Search OSRS item...");
        itemSearch.setSingleLine(true);
        itemSearch.setTextColor(Color.WHITE);
        itemSearch.setHintTextColor(Color.GRAY);

        Button priceButton = new Button(this);
        priceButton.setText("CHECK OSRS PRICE");
        priceButton.setTextSize(18);

        priceButton.setOnClickListener(v -> checkPrice());

        priceResult = new TextView(this);
        priceResult.setText("");
        priceResult.setTextSize(18);
        priceResult.setTextColor(Color.WHITE);
        priceResult.setGravity(Gravity.CENTER);
        priceResult.setPadding(10, 25, 10, 25);

        root.addView(title);
        root.addView(version);
        root.addView(subtitle);
        root.addView(questButton);
        root.addView(priceTitle);
        root.addView(itemSearch);
        root.addView(priceButton);
        root.addView(priceResult);

        scroll.addView(root);

        setContentView(scroll);
    }

    private void showQuestGuide() {

        String[] quests = {
                "Cook's Assistant",
                "The Restless Ghost",
                "Sheep Shearer",
                "Rune Mysteries",
                "Romeo & Juliet",
                "Waterfall Quest"
        };

        new AlertDialog.Builder(this)
                .setTitle("Quest Guide")
                .setItems(quests, (dialog, which) -> {

                    String details;

                    switch (which) {

                        case 0:
                            details =
                                    "COOK'S ASSISTANT\n\n" +
                                    "Start: Cook in Lumbridge Castle\n\n" +
                                    "Requirements: None\n\n" +
                                    "Get an egg, bucket of milk and flour, " +
                                    "then return them to the Cook.";
                            break;

                        case 1:
                            details =
                                    "THE RESTLESS GHOST\n\n" +
                                    "Start: Father Aereck\n\n" +
                                    "Requirements: None\n\n" +
                                    "Help the ghost in the Lumbridge " +
                                    "graveyard.";
                            break;

                        case 2:
                            details =
                                    "SHEEP SHEARER\n\n" +
                                    "Start: Farmer Fred\n\n" +
                                    "Requirements: None\n\n" +
                                    "Shear sheep and complete Farmer Fred's request.";
                            break;

                        case 3:
                            details =
                                    "RUNE MYSTERIES\n\n" +
                                    "Start: Duke Horacio\n\n" +
                                    "Requirements: None\n\n" +
                                    "Investigate the mystery surrounding rune essence.";
                            break;

                        case 4:
                            details =
                                    "ROMEO & JULIET\n\n" +
                                    "Start: Romeo in Varrock\n\n" +
                                    "Requirements: None\n\n" +
                                    "Help Romeo and Juliet.";
                            break;

                        default:
                            details =
                                    "WATERFALL QUEST\n\n" +
                                    "Start: Almera near Baxtorian Falls\n\n" +
                                    "Explore the waterfall and recover its treasure.";
                            break;
                    }

                    new AlertDialog.Builder(this)
                            .setTitle(quests[which])
                            .setMessage(details)
                            .setPositiveButton("CLOSE", null)
                            .show();
                })
                .setNegativeButton("CLOSE", null)
                .show();
    }

    private void checkPrice() {

        String query =
                itemSearch.getText().toString().trim();

        if (query.isEmpty()) {

            Toast.makeText(
                    this,
                    "Please enter an OSRS item.",
                    Toast.LENGTH_SHORT
            ).show();

            return;
        }

        priceResult.setText("Checking price...");

        executor.execute(() -> {

            try {

                String mappingJson =
                        getJson(MAPPING_URL);

                JSONArray mapping =
                        new JSONArray(mappingJson);

                int itemId = -1;
                String itemName = "";

                for (int i = 0; i < mapping.length(); i++) {

                    JSONObject item =
                            mapping.getJSONObject(i);

                    String name =
                            item.optString("name", "");

                    if (name.equalsIgnoreCase(query)) {

                        itemId =
                                item.optInt("id", -1);

                        itemName = name;

                        break;
                    }
                }

                if (itemId == -1) {

                    String search =
                            query.toLowerCase(Locale.US);

                    for (int i = 0; i < mapping.length(); i++) {

                        JSONObject item =
                                mapping.getJSONObject(i);

                        String name =
                                item.optString("name", "");

                        if (name.toLowerCase(Locale.US)
                                .contains(search)) {

                            itemId =
                                    item.optInt("id", -1);

                            itemName = name;

                            break;
                        }
                    }
                }

                if (itemId == -1) {

                    runOnUiThread(() ->
                            priceResult.setText(
                                    "ITEM NOT FOUND\n\n" +
                                    "Try another OSRS item name."
                            )
                    );

                    return;
                }

                String json =
                        getJson(
                                LATEST_URL +
                                "?id=" +
                                itemId
                        );

                JSONObject root =
                        new JSONObject(json);

                JSONObject data =
                        root.getJSONObject("data");

                JSONObject itemData =
                        data.getJSONObject(
                                String.valueOf(itemId)
                        );

                int high =
                        itemData.optInt("high", 0);

                int low =
                        itemData.optInt("low", 0);

                String result =
                        itemName +
                        "\n\n" +
                        "HIGH: " +
                        formatGp(high) +
                        " gp\n\n" +
                        "LOW: " +
                        formatGp(low) +
                        " gp";

                runOnUiThread(() ->
                        priceResult.setText(result)
                );

            } catch (Exception e) {

                runOnUiThread(() ->
                        priceResult.setText(
                                "PRICE CHECK FAILED\n\n" +
                                "Check your internet connection " +
                                "and try again."
                        )
                );
            }
        });
    }

    private String getJson(String address)
            throws Exception {

        HttpURLConnection connection =
                (HttpURLConnection)
                        new URL(address).openConnection();

        try {

            connection.setRequestMethod("GET");
            connection.setConnectTimeout(10000);
            connection.setReadTimeout(15000);

            connection.setRequestProperty(
                    "User-Agent",
                    "QuestMate/2.0"
            );

            int response =
                    connection.getResponseCode();

            if (response != 200) {
                throw new IOException(
                        "HTTP " + response
                );
            }

            BufferedReader reader =
                    new BufferedReader(
                            new InputStreamReader(
                                    connection.getInputStream()
                            )
                    );

            StringBuilder output =
                    new StringBuilder();

            String line;

            while ((line = reader.readLine()) != null) {
                output.append(line);
            }

            reader.close();

            return output.toString();

        } finally {

            connection.disconnect();
        }
    }

    private String formatGp(int amount) {

        if (amount >= 1000000) {

            return String.format(
                    Locale.US,
                    "%.1fM",
                    amount / 1000000.0
            );
        }

        if (amount >= 1000) {

            return String.format(
                    Locale.US,
                    "%.1fK",
                    amount / 1000.0
            );
        }

        return String.valueOf(amount);
    }

    @Override
    protected void onDestroy() {

        executor.shutdownNow();

        super.onDestroy();
    }
}
EOF

