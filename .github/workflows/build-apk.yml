name: Build QuestMate APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create QuestMate project
        run: |

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="QuestMate"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#66BB6A</item>
                  <item name="android:navigationBarColor">#10131A</item>
                  <item name="android:statusBarColor">#10131A</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/assets/quests.json <<'EOF'
          [
            {
              "name": "Cook's Assistant",
              "members": false,
              "difficulty": "Novice",
              "length": "Very Short",
              "questPoints": 1,
              "start": "Cook in Lumbridge Castle",
              "requirements": [
                "None"
              ],
              "items": [
                "Pot",
                "Bucket",
                "Egg"
              ],
              "steps": [
                "Talk to the Cook in the kitchen of Lumbridge Castle.",
                "Tell the Cook you will help him prepare the Duke's birthday cake.",
                "Get an egg from the chicken farm north-east of Lumbridge.",
                "Get a bucket of milk from a dairy cow.",
                "Get a pot of flour. You can buy flour or collect grain and use the windmill.",
                "Return to the Cook in Lumbridge Castle.",
                "Give the Cook the egg, bucket of milk and pot of flour.",
                "The quest is complete."
              ],
              "rewards": [
                "1 Quest Point",
                "300 Cooking XP"
              ]
            },

            {
              "name": "The Restless Ghost",
              "members": false,
              "difficulty": "Novice",
              "length": "Short",
              "questPoints": 1,
              "start": "Father Aereck in the Lumbridge chapel",
              "requirements": [
                "None",
                "You must be able to avoid or survive a level 13 skeleton"
              ],
              "items": [
                "None required to start"
              ],
              "steps": [
                "Speak to Father Aereck in the Lumbridge chapel.",
                "Ask him about the ghost in the graveyard.",
                "Travel south through Lumbridge Swamp to Father Urhney's house.",
                "Speak to Father Urhney and receive the ghostspeak amulet.",
                "Return to the Lumbridge graveyard.",
                "Wear the ghostspeak amulet and search the coffin.",
                "Speak to the Restless Ghost.",
                "Travel to the Wizards' Tower south of Draynor Village.",
                "Go downstairs in the Wizards' Tower.",
                "Search the altar to obtain the ghost's skull.",
                "A level 13 skeleton appears. You can run away instead of fighting it.",
                "Return to the Lumbridge graveyard.",
                "Use the ghost's skull on the coffin.",
                "The ghost will disappear and the quest will be completed."
              ],
              "rewards": [
                "1 Quest Point",
                "1,125 Prayer XP",
                "Ghostspeak amulet"
              ]
            },

            {
              "name": "Sheep Shearer",
              "members": false,
              "difficulty": "Novice",
              "length": "Very Short",
              "questPoints": 1,
              "start": "Farmer Fred at the farm north of Lumbridge",
              "requirements": [
                "None"
              ],
              "items": [
                "Shears"
              ],
              "steps": [
                "Speak to Farmer Fred at his farm north of Lumbridge.",
                "Agree to shear his sheep.",
                "Get a pair of shears if you do not already have them.",
                "Shear sheep in the nearby field.",
                "Collect 20 balls of wool.",
                "Use the wool on a spinning wheel to turn it into balls of wool.",
                "The Lumbridge Castle spinning wheel is a convenient option.",
                "Return to Farmer Fred.",
                "Give him the 20 balls of wool.",
                "The quest is complete."
              ],
              "rewards": [
                "1 Quest Point",
                "150 Crafting XP"
              ]
            },

            {
              "name": "Rune Mysteries",
              "members": false,
              "difficulty": "Novice",
              "length": "Short",
              "questPoints": 1,
              "start": "Duke Horacio in Lumbridge Castle",
              "requirements": [
                "None"
              ],
              "items": [
                "None"
              ],
              "steps": [
                "Speak to Duke Horacio in Lumbridge Castle.",
                "Ask him about the mysterious talisman.",
                "Take the air talisman to Archmage Sedridor in the Wizards' Tower.",
                "Speak to Sedridor in the basement of the Wizards' Tower.",
                "Take Sedridor's research package to Aubury in Varrock.",
                "Go to Aubury's Rune Shop in Varrock.",
                "Speak to Aubury and give him the research package.",
                "Return to Sedridor with Aubury's information.",
                "Speak to Sedridor to complete the quest."
              ],
              "rewards": [
                "1 Quest Point",
                "Access to Runecrafting",
                "Air talisman"
              ]
            },

            {
              "name": "Romeo & Juliet",
              "members": false,
              "difficulty": "Novice",
              "length": "Short",
              "questPoints": 5,
              "start": "Romeo in Varrock",
              "requirements": [
                "None"
              ],
              "items": [
                "Cadava berries",
                "Cadava potion"
              ],
              "steps": [
                "Speak to Romeo in Varrock.",
                "Agree to help him with Juliet.",
                "Speak to Juliet on the balcony of her house.",
                "Return to Romeo and tell him Juliet wants help.",
                "Speak to Father Lawrence in Varrock.",
                "Find Apothecary in south-west Varrock.",
                "Collect cadava berries near Varrock.",
                "Give the cadava berries to Apothecary.",
                "Receive the cadava potion.",
                "Give the potion to Juliet.",
                "Return to Romeo.",
                "Complete the final conversation.",
                "The quest is complete."
              ],
              "rewards": [
                "5 Quest Points"
              ]
            }
          ]
          EOF

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final String MAPPING_URL =
                      "https://prices.runescape.wiki/api/v1/osrs/mapping";

              private static final String LATEST_URL =
                      "https://prices.runescape.wiki/api/v1/osrs/latest";

              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor();

              private TextView resultText;
              private EditText itemSearch;
              private Button priceButton;

              private final List<Quest> quests =
                      new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loadQuests();

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          24,
                          40,
                          24,
                          24);

                  root.setBackgroundColor(
                          Color.rgb(16, 19, 26));

                  TextView title =
                          new TextView(this);

                  title.setText("QuestMate");
                  title.setTextSize(34);
                  title.setTypeface(
                          null,
                          Typeface.BOLD);

                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);

                  TextView subtitle =
                          new TextView(this);

                  subtitle.setText(
                          "OSRS Quest & Item Companion");

                  subtitle.setTextSize(17);
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setGravity(Gravity.CENTER);

                  subtitle.setPadding(
                          0,
                          10,
                          0,
                          24);

                  Button questButton =
                          new Button(this);

                  questButton.setText(
                          "QUEST GUIDE");

                  questButton.setOnClickListener(
                          v -> showQuestGuide());

                  itemSearch =
                          new EditText(this);

                  itemSearch.setHint(
                          "Search OSRS item...");

                  itemSearch.setSingleLine(true);
                  itemSearch.setTextColor(Color.WHITE);
                  itemSearch.setHintTextColor(
                          Color.GRAY);

                  priceButton =
                          new Button(this);

                  priceButton.setText(
                          "CHECK OSRS PRICE");

                  priceButton.setOnClickListener(
                          v -> checkPrice());

                  resultText =
                          new TextView(this);

                  resultText.setTextColor(
                          Color.WHITE);

                  resultText.setTextSize(18);

                  resultText.setPadding(
                          8,
                          24,
                          8,
                          8);

                  resultText.setText("Ready.");

                  root.addView(title);
                  root.addView(subtitle);
                  root.addView(questButton);
                  root.addView(itemSearch);
                  root.addView(priceButton);
                  root.addView(resultText);

                  setContentView(root);
              }

              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open(
                                      "quests.json");

                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              input));

                      StringBuilder json =
                              new StringBuilder();

                      String line;

                      while ((line =
                              reader.readLine()) != null) {

                          json.append(line);
                      }

                      reader.close();

                      JSONArray array =
                              new JSONArray(
                                      json.toString());

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          JSONObject object =
                                  array.getJSONObject(i);

                          Quest quest =
                                  new Quest();

                          quest.name =
                                  object.optString(
                                          "name");

                          quest.members =
                                  object.optBoolean(
                                          "members");

                          quest.difficulty =
                                  object.optString(
                                          "difficulty");

                          quest.length =
                                  object.optString(
                                          "length");

                          quest.questPoints =
                                  object.optInt(
                                          "questPoints");

                          quest.start =
                                  object.optString(
                                          "start");

                          quest.requirements =
                                  readArray(
                                          object,
                                          "requirements");

                          quest.items =
                                  readArray(
                                          object,
                                          "items");

                          quest.steps =
                                  readArray(
                                          object,
                                          "steps");

                          quest.rewards =
                                  readArray(
                                          object,
                                          "rewards");

                          quests.add(quest);
                      }

                  } catch (Exception e) {

                      e.printStackTrace();
                  }
              }

              private List<String> readArray(
                      JSONObject object,
                      String name) {

                  List<String> result =
                          new ArrayList<>();

                  JSONArray array =
                          object.optJSONArray(name);

                  if (array == null) {
                      return result;
                  }

                  for (int i = 0;
                       i < array.length();
                       i++) {

                      result.add(
                              array.optString(i));
                  }

                  return result;
              }

              private void showQuestGuide() {

                  final AlertDialog dialog =
                          new AlertDialog.Builder(this)
                                  .create();

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          20,
                          20,
                          20,
                          20);

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "OSRS QUEST GUIDE");

                  title.setTextSize(24);

                  title.setTypeface(
                          null,
                          Typeface.BOLD);

                  title.setTextColor(Color.WHITE);

                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Search quests...");

                  search.setSingleLine(true);

                  LinearLayout list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL);

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.addView(list);

                  root.addView(title);
                  root.addView(search);
                  root.addView(scroll);

                  dialog.setView(root);

                  Runnable refresh =
                          () -> {

                              list.removeAllViews();

                              String query =
                                      search.getText()
                                              .toString()
                                              .toLowerCase(
                                                      Locale.US);

                              for (Quest quest :
                                      quests) {

                                  if (!quest.name
                                          .toLowerCase(
                                                  Locale.US)
                                          .contains(query)) {
                                      continue;
                                  }

                                  Button button =
                                          new Button(
                                                  this);

                                  String label =
                                          quest.name +
                                          (quest.members
                                                  ? "  [Members]"
                                                  : "  [F2P]");

                                  button.setText(label);

                                  button.setOnClickListener(
                                          v -> {
                                              dialog.dismiss();
                                              showQuestDetails(
                                                      quest);
                                          });

                                  list.addView(button);
                              }
                          };

                  search.addTextChangedListener(
                          new TextWatcher() {

                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after) {
                              }

                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count) {

                                  refresh.run();
                              }

                              @Override
                              public void afterTextChanged(
                                      Editable s) {
                              }
                          });

                  refresh.run();

                  dialog.show();
              }

              private void showQuestDetails(
                      Quest quest) {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          20,
                          10,
                          20,
                          10);

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.addView(root);

                  TextView title =
                          new TextView(this);

                  title.setText(
                          quest.name);

                  title.setTextSize(27);

                  title.setTypeface(
                          null,
                          Typeface.BOLD);

                  root.addView(title);

                  TextView info =
                          new TextView(this);

                  info.setText(
                          "\n" +
                          "Difficulty: " +
                          quest.difficulty +
                          "\n" +
                          "Length: " +
                          quest.length +
                          "\n" +
                          "Quest Points: " +
                          quest.questPoints +
                          "\n\n" +
                          "Start: " +
                          quest.start);

                  info.setTextSize(17);

                  root.addView(info);

                  addSection(
                          root,
                          "REQUIREMENTS",
                          quest.requirements);

                  addSection(
                          root,
                          "ITEMS",
                          quest.items);

                  TextView stepsTitle =
                          new TextView(this);

                  stepsTitle.setText(
                          "\nSTEP-BY-STEP WALKTHROUGH");

                  stepsTitle.setTextSize(20);

                  stepsTitle.setTypeface(
                          null,
                          Typeface.BOLD);

                  root.addView(stepsTitle);

                  int stepNumber = 1;

                  for (String step :
                          quest.steps) {

                      CheckBox checkBox =
                              new CheckBox(this);

                      checkBox.setText(
                              stepNumber +
                              ". " +
                              step);

                      checkBox.setTextSize(16);

                      checkBox.setPadding(
                              0,
                              8,
                              0,
                              8);

                      root.addView(checkBox);

                      stepNumber++;
                  }

                  addSection(
                          root,
                          "REWARDS",
                          quest.rewards);

                  new AlertDialog.Builder(this)
                          .setTitle(quest.name)
                          .setView(scroll)
                          .setPositiveButton(
                                  "DONE",
                                  null)
                          .show();
              }

              private void addSection(
                      LinearLayout root,
                      String title,
                      List<String> values) {

                  TextView heading =
                          new TextView(this);

                  heading.setText(
                          "\n" + title);

                  heading.setTextSize(20);

                  heading.setTypeface(
                          null,
                          Typeface.BOLD);

                  root.addView(heading);

                  for (String value :
                          values) {

                      TextView text =
                              new TextView(this);

                      text.setText(
                              "• " + value);

                      text.setTextSize(16);

                      text.setPadding(
                              0,
                              5,
                              0,
                              5);

                      root.addView(text);
                  }
              }

              private void checkPrice() {

                  final String query =
                          itemSearch.getText()
                                  .toString()
                                  .trim();

                  if (query.isEmpty()) {

                      resultText.setText(
                              "Type an OSRS item name first.");

                      return;
                  }

                  priceButton.setEnabled(false);

                  resultText.setText(
                          "Looking up " +
                          query +
                          "...");

                  executor.execute(() -> {

                      try {

                          JSONArray mapping =
                                  new JSONArray(
                                          getJson(
                                                  MAPPING_URL));

                          int itemId = -1;
                          String itemName = null;

                          String search =
                                  query.toLowerCase(
                                          Locale.US);

                          for (int i = 0;
                               i < mapping.length();
                               i++) {

                              JSONObject item =
                                      mapping.getJSONObject(i);

                              String name =
                                      item.optString(
                                              "name",
                                              "");

                              if (name.equalsIgnoreCase(
                                      query)) {

                                  itemId =
                                          item.optInt(
                                                  "id",
                                                  -1);

                                  itemName = name;

                                  break;
                              }
                          }

                          if (itemId == -1) {

                              for (int i = 0;
                                   i < mapping.length();
                                   i++) {

                                  JSONObject item =
                                          mapping.getJSONObject(
                                                  i);

                                  String name =
                                          item.optString(
                                                  "name",
                                                  "");

                                  if (name
                                          .toLowerCase(
                                                  Locale.US)
                                          .contains(search)) {

                                      itemId =
                                              item.optInt(
                                                      "id",
                                                      -1);

                                      itemName = name;

                                      break;
                                  }
                              }
                          }

                          if (itemId == -1) {

                              throw new Exception(
                                      "Item not found.");
                          }

                          String json =
                                  getJson(
                                          LATEST_URL +
                                          "?id=" +
                                          itemId);

                          JSONObject root =
                                  new JSONObject(json);

                          JSONObject data =
                                  root.getJSONObject(
                                          "data");

                          JSONObject price =
                                  data.getJSONObject(
                                          String.valueOf(
                                                  itemId));

                          int high =
                                  price.optInt(
                                          "high",
                                          0);

                          int low =
                                  price.optInt(
                                          "low",
                                          0);

                          final String message =
                                  itemName +
                                  "\n\nHigh: " +
                                  formatGp(high) +
                                  " gp\nLow: " +
                                  formatGp(low) +
                                  " gp";

                          runOnUiThread(() -> {

                              priceButton
                                      .setEnabled(true);

                              resultText
                                      .setText(message);
                          });

                      } catch (Exception e) {

                          final String message =
                                  "Price lookup failed:\n" +
                                  e.getMessage();

                          runOnUiThread(() -> {

                              priceButton
                                      .setEnabled(true);

                              resultText
                                      .setText(message);
                          });
                      }
                  });
              }

              private String getJson(
                      String urlString)
                      throws Exception {

                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  new URL(urlString)
                                          .openConnection();

                  try {

                      connection.setRequestMethod(
                              "GET");

                      connection.setConnectTimeout(
                              10000);

                      connection.setReadTimeout(
                              15000);

                      connection.setRequestProperty(
                              "User-Agent",
                              "QuestMate/2.0");

                      int code =
                              connection
                                      .getResponseCode();

                      if (code !=
                              HttpURLConnection.HTTP_OK) {

                          throw new Exception(
                                  "HTTP " + code);
                      }

                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              connection
                                                      .getInputStream()));

                      StringBuilder result =
                              new StringBuilder();

                      String line;

                      while ((line =
                              reader.readLine()) != null) {

                          result.append(line);
                      }

                      reader.close();

                      return result.toString();

                  } finally {

                      connection.disconnect();
                  }
              }

              private String formatGp(
                      int value) {

                  return String.format(
                          Locale.US,
                          "%,d",
                          value);
              }

              @Override
              protected void onDestroy() {

                  executor.shutdownNow();

                  super.onDestroy();
              }

              private static class Quest {

                  String name;
                  boolean members;
                  String difficulty;
                  String length;
                  int questPoints;
                  String start;

                  List<String> requirements =
                          new ArrayList<>();

                  List<String> items =
                          new ArrayList<>();

                  List<String> steps =
                          new ArrayList<>();

                  List<String> rewards =
                          new ArrayList<>();
              }
          }
          EOF

      - name: Build APK
        run: |

          gradle clean assembleDebug --stacktrace

          echo "Checking for APK..."

          ls -lah app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/QuestMate.apk

          echo "APK successfully created:"

          ls -lh dist/QuestMate.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: dist/QuestMate.apk
          if-no-files-found: error
