name: Build QuestMate Complete

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 4. GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. FIND THE EXISTING QUESTMATE APK
      #
      # The old APK is only used as the source for quests.json.
      # We are NOT modifying the old application.
      # ============================================================

      - name: Find existing QuestMate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input

          echo "=========================================="
          echo " FINDING QUESTMATE DATABASE"
          echo "=========================================="

          # --------------------------------------------------------
          # Prefer QuestMate.apk in the repository.
          # --------------------------------------------------------

          if [ -f "QuestMate.apk" ]; then

            cp QuestMate.apk input/QuestMate.apk

            echo "Using QuestMate.apk from repository."

          else

            echo "QuestMate.apk not found in repository."
            echo "Searching previous GitHub Actions artifacts..."

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              -o artifacts.json

            ARTIFACT_ID=$(jq -r '
              [
                .artifacts[]
                | select(.expired == false)
                | select(
                    (.name | ascii_downcase | contains("questmate"))
                    and
                    (.name | ascii_downcase | contains("apk"))
                )
              ]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' artifacts.json)

            if [ -z "$ARTIFACT_ID" ]; then

              echo ""
              echo "=========================================="
              echo " ERROR"
              echo "=========================================="
              echo ""
              echo "No QuestMate APK artifact was found."
              echo ""
              echo "Put QuestMate.apk in the repository root"
              echo "and run this workflow again."
              echo ""

              exit 1

            fi

            echo ""
            echo "Using APK artifact ID:"
            echo "$ARTIFACT_ID"

            curl -fsSL \
              -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o input/artifact.zip

            mkdir -p input/extracted

            unzip -o \
              input/artifact.zip \
              -d input/extracted

            FOUND_APK=$(find input/extracted \
              -type f \
              -iname "*.apk" \
              | head -n 1)

            if [ -z "$FOUND_APK" ]; then

              echo "ERROR: Selected artifact did not contain an APK."

              find input/extracted \
                -type f \
                -print

              exit 1

            fi

            cp "$FOUND_APK" input/QuestMate.apk

          fi

          echo ""
          echo "Source APK:"
          ls -lh input/QuestMate.apk


      # ============================================================
      # 6. EXTRACT THE QUEST DATABASE
      #
      # The old UI is NOT reused.
      #
      # Only quests.json is used.
      # ============================================================

      - name: Extract quest database
        run: |
          set -e

          mkdir -p app/src/main/assets

          unzip -p \
            input/QuestMate.apk \
            assets/quests.json \
            > app/src/main/assets/quests.json

          python3 -m json.tool \
            app/src/main/assets/quests.json \
            > /dev/null

          echo ""
          echo "Quest database is valid."

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/quests.json"

          with open(path, encoding="utf-8") as f:
              quests = json.load(f)

          step_count = 0

          for quest in quests:
              for section in quest.get("walkthrough", []):
                  step_count += len(section.get("steps", []))

          print("")
          print("==========================================")
          print(" QUEST DATABASE")
          print("==========================================")
          print("")
          print("Quest records:", len(quests))
          print("Walkthrough steps:", step_count)
          print("")
          print("==========================================")
          PY


      # ============================================================
      # 7. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create clean Android project
        run: |
          set -e

          mkdir -p \
            app/src/main/java/com/questmate/complete


          # --------------------------------------------------------
          # SETTINGS
          # --------------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMateComplete"

          include(":app")
          EOF


          # --------------------------------------------------------
          # ROOT BUILD
          # --------------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF


          # --------------------------------------------------------
          # APP BUILD
          # --------------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {

              namespace "com.questmate.complete"

              compileSdk 35

              defaultConfig {

                  applicationId "com.questmate.complete"

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"
              }
          }
          EOF


          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="QuestMate Complete"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 8. CREATE NEW QUESTMATE APPLICATION
      # ============================================================

      - name: Create QuestMate Complete application
        run: |

          cat > app/src/main/java/com/questmate/complete/MainActivity.java <<'EOF'
          package com.questmate.complete;

          import android.app.Activity;
          import android.os.Bundle;

          import android.graphics.Color;
          import android.graphics.Typeface;

          import android.graphics.drawable.GradientDrawable;

          import android.text.InputType;
          import android.text.TextWatcher;
          import android.text.Editable;

          import android.view.View;
          import android.view.ViewGroup;

          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.Locale;


          public class MainActivity extends Activity {

              private final ArrayList<JSONObject> quests =
                      new ArrayList<>();

              private final ArrayList<String> questNames =
                      new ArrayList<>();

              private ArrayAdapter<String> adapter;

              private ListView questList;

              private EditText searchBox;


              // ----------------------------------------------------
              // SCREEN HELPERS
              // ----------------------------------------------------

              private int dp(float value) {

                  return (int)(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                          + 0.5f
                  );
              }


              private TextView makeText(
                      String value,
                      float size,
                      boolean bold) {

                  TextView text =
                          new TextView(this);

                  text.setText(value);

                  text.setTextSize(size);

                  text.setTextColor(Color.WHITE);

                  text.setTypeface(
                          bold
                                  ? Typeface.DEFAULT_BOLD
                                  : Typeface.DEFAULT
                  );

                  text.setPadding(
                          dp(12),
                          dp(7),
                          dp(12),
                          dp(7)
                  );

                  return text;
              }


              private GradientDrawable background(
                      int color,
                      int radius) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);

                  drawable.setCornerRadius(
                          dp(radius)
                  );

                  return drawable;
              }


              private LinearLayout baseLayout() {

                  LinearLayout layout =
                          new LinearLayout(this);

                  layout.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  layout.setPadding(
                          dp(10),
                          dp(10),
                          dp(10),
                          dp(25)
                  );

                  layout.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );

                  return layout;
              }


              private void addText(
                      LinearLayout layout,
                      String value,
                      float size,
                      boolean bold) {

                  layout.addView(
                          makeText(value,size,bold),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );
              }


              // ----------------------------------------------------
              // START
              // ----------------------------------------------------

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  getWindow().setStatusBarColor(
                          Color.rgb(12,12,12)
                  );

                  loadQuests();

                  showQuestList();
              }


              // ----------------------------------------------------
              // LOAD QUESTS
              // ----------------------------------------------------

              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open(
                                      "quests.json"
                              );

                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              input,
                                              "UTF-8"
                                      )
                              );

                      StringBuilder data =
                              new StringBuilder();

                      String line;

                      while (
                              (line = reader.readLine())
                                      != null
                      ) {

                          data.append(line);
                      }

                      JSONArray array =
                              new JSONArray(
                                      data.toString()
                              );

                      for (
                              int i = 0;
                              i < array.length();
                              i++
                      ) {

                          JSONObject quest =
                                  array.getJSONObject(i);

                          quests.add(quest);

                          questNames.add(
                                  quest.optString(
                                          "title",
                                          "Quest"
                                  )
                          );
                      }

                      reader.close();

                  } catch(Exception error) {

                      Toast.makeText(
                              this,
                              "Could not load quest database.",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }


              // ----------------------------------------------------
              // QUEST LIST
              // ----------------------------------------------------

              private void showQuestList() {

                  LinearLayout root =
                          baseLayout();


                  TextView title =
                          makeText(
                                  "QuestMate Complete",
                                  25,
                                  true
                          );

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(50)
                          )
                  );


                  TextView subtitle =
                          makeText(
                                  "Full quest walkthroughs • Items marked as needed",
                                  13,
                                  false
                          );

                  subtitle.setTextColor(
                          Color.LTGRAY
                  );

                  root.addView(
                          subtitle,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );


                  searchBox =
                          new EditText(this);

                  searchBox.setHint(
                          "Search quests..."
                  );

                  searchBox.setHintTextColor(
                          Color.LTGRAY
                  );

                  searchBox.setTextColor(
                          Color.WHITE
                  );

                  searchBox.setSingleLine(
                          true
                  );

                  searchBox.setInputType(
                          InputType.TYPE_CLASS_TEXT
                  );

                  searchBox.setPadding(
                          dp(14),
                          0,
                          dp(14),
                          0
                  );

                  searchBox.setBackground(
                          background(
                                  Color.rgb(45,45,45),
                                  14
                          )
                  );

                  LinearLayout.LayoutParams searchParams =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          );

                  searchParams.setMargins(
                          0,
                          dp(8),
                          0,
                          dp(8)
                  );

                  root.addView(
                          searchBox,
                          searchParams
                  );


                  questList =
                          new ListView(this);

                  questList.setDivider(null);

                  questList.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );


                  adapter =
                          new ArrayAdapter<String>(
                                  this,
                                  android.R.layout
                                          .simple_list_item_1,
                                  new ArrayList<>(
                                          questNames
                                  )
                          ) {

                              @Override
                              public View getView(
                                      int position,
                                      View convertView,
                                      ViewGroup parent) {

                                  TextView view =
                                          (TextView)
                                                  super.getView(
                                                          position,
                                                          convertView,
                                                          parent
                                                  );

                                  view.setTextColor(
                                          Color.WHITE
                                  );

                                  view.setTextSize(
                                          17
                                  );

                                  view.setPadding(
                                          dp(14),
                                          dp(13),
                                          dp(14),
                                          dp(13)
                                  );

                                  return view;
                              }
                          };


                  questList.setAdapter(
                          adapter
                  );


                  root.addView(
                          questList,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  setContentView(root);


                  searchBox.addTextChangedListener(
                          new TextWatcher() {

                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after) {
                              }


                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count) {

                                  filterQuests(
                                          s.toString()
                                  );
                              }


                              @Override
                              public void afterTextChanged(
                                      Editable e) {
                              }
                          }
                  );


                  questList.setOnItemClickListener(
                          (parent, view, position, id) -> {

                              String name =
                                      adapter.getItem(
                                              position
                                      );

                              if (name == null)
                                  return;

                              for (
                                      JSONObject quest :
                                      quests
                              ) {

                                  if (
                                          quest.optString(
                                                  "title"
                                          ).equals(name)
                                  ) {

                                      showQuest(
                                              quest
                                      );

                                      break;
                                  }
                              }
                          }
                  );
              }


              // ----------------------------------------------------
              // SEARCH
              // ----------------------------------------------------

              private void filterQuests(
                      String query) {

                  String needle =
                          query.toLowerCase(
                                  Locale.ROOT
                          );

                  ArrayList<String> result =
                          new ArrayList<>();

                  for (
                          String name :
                          questNames
                  ) {

                      if (
                              name.toLowerCase(
                                      Locale.ROOT
                              ).contains(needle)
                      ) {

                          result.add(name);
                      }
                  }

                  adapter.clear();

                  adapter.addAll(result);

                  adapter.notifyDataSetChanged();
              }


              // ----------------------------------------------------
              // ITEM DETECTION
              // ----------------------------------------------------

              private boolean startsWithAction(
                      String text) {

                  String value =
                          text.toLowerCase(
                                  Locale.ROOT
                          ).trim();

                  String[] actions = {

                          "talk ",
                          "speak ",
                          "search ",
                          "enter ",
                          "kill ",
                          "fight ",
                          "cast ",
                          "read ",
                          "open ",
                          "chop ",
                          "solve ",
                          "inspect ",
                          "watch ",
                          "return ",
                          "go ",
                          "travel ",
                          "pickpocket ",
                          "use ",
                          "take ",
                          "buy ",
                          "mine ",
                          "cook ",
                          "light ",
                          "climb ",
                          "equip ",
                          "withdraw ",
                          "bank ",
                          "dig ",
                          "cut ",
                          "complete ",
                          "finish ",
                          "start ",
                          "locate ",
                          "investigate ",
                          "collect ",
                          "pick ",
                          "loot ",
                          "head ",
                          "walk ",
                          "run ",
                          "proceed ",
                          "leave ",
                          "defeat "
                  };


                  for (
                          String action :
                          actions
                  ) {

                      if (
                              value.startsWith(
                                      action
                              )
                      ) {

                          return true;
                      }
                  }

                  return false;
              }


              private boolean isItemStep(
                      String text) {

                  String value =
                          text.toLowerCase(
                                  Locale.ROOT
                          ).trim();


                  String[] directStarts = {

                          "any ",
                          "decent food",
                          "bring ",
                          "have ",
                          "you will need ",
                          "you'll need ",
                          "needed:",
                          "required:",
                          "recommended:",
                          "combat gear",
                          "melee combat gear",
                          "ranged combat gear",
                          "magic combat gear",
                          "melee or range gear",
                          "ranged or melee gear",
                          "melee or magic gear",
                          "magic or range gear",
                          "gear to",
                          "equipment to",
                          "runes/equipment"
                  };


                  for (
                          String start :
                          directStarts
                  ) {

                      if (
                              value.startsWith(
                                      start
                              )
                      ) {

                          return true;
                      }
                  }


                  String[] itemWords = {

                          "gear",
                          "equipment",
                          "food",
                          "runes",
                          "rune",
                          "teleport",
                          "necklace",
                          "amulet",
                          "talisman",
                          "staff",
                          "axe",
                          "pickaxe",
                          "harpoon",
                          "spade",
                          "hammer",
                          "bucket",
                          "jug",
                          "vial",
                          "potion",
                          "antipoison",
                          "antifire",
                          "anti-fire",
                          "weapon",
                          "armour",
                          "armor",
                          "boots",
                          "gloves",
                          "cape",
                          "ring",
                          "shield",
                          "helmet",
                          "hat",
                          "bow",
                          "crossbow",
                          "arrows",
                          "arrow",
                          "bolts",
                          "bolt",
                          "ammo",
                          "dagger",
                          "sword",
                          "scimitar",
                          "mace",
                          "spear",
                          "rod",
                          "rope",
                          "coins",
                          "coin",
                          "logs",
                          "log",
                          "coal",
                          "ore",
                          "knife",
                          "needle",
                          "thread",
                          "chisel",
                          "tinderbox",
                          "lantern",
                          "candle",
                          "torch",
                          "pot",
                          "cake",
                          "milk",
                          "meat",
                          "shark",
                          "lobster",
                          "monkfish",
                          "karambwan",
                          "restore",
                          "stamina",
                          "tablet",
                          "xeric",
                          "kharedst",
                          "cat",
                          "flail",
                          "shears",
                          "seeds",
                          "seed"
                  };


                  for (
                          String word :
                          itemWords
                  ) {

                      if (
                              value.contains(
                                      word
                              )
                      ) {

                          return true;
                      }
                  }


                  return false;
              }


              // ----------------------------------------------------
              // COMPILE TOP ITEM LIST
              // ----------------------------------------------------

              private ArrayList<String> compileItems(
                      JSONObject quest) {

                  ArrayList<String> result =
                          new ArrayList<>();

                  HashSet<String> seen =
                          new HashSet<>();


                  try {

                      JSONArray sections =
                              quest.optJSONArray(
                                      "walkthrough"
                              );

                      if (sections == null)
                          return result;


                      for (
                              int i = 0;
                              i < sections.length();
                              i++
                      ) {

                          JSONObject section =
                                  sections.getJSONObject(i);

                          JSONArray steps =
                                  section.optJSONArray(
                                          "steps"
                                  );

                          if (steps == null)
                              continue;


                          for (
                                  int j = 0;
                                  j < steps.length();
                                  j++
                          ) {

                              String step =
                                      steps.optString(
                                              j,
                                              ""
                                      ).trim();


                              if (
                                      !isItemStep(step)
                              ) {

                                  continue;
                              }


                              String key =
                                      step
                                              .toLowerCase(
                                                      Locale.ROOT
                                              )
                                              .replaceAll(
                                                      "[.!?,;:]+$",
                                                      ""
                                              )
                                              .replaceAll(
                                                      "\\s+",
                                                      " "
                                              );


                              if (
                                      !seen.contains(key)
                              ) {

                                  seen.add(key);

                                  result.add(step);
                              }
                          }
                      }

                  } catch(Exception ignored) {
                  }


                  return result;
              }


              // ----------------------------------------------------
              // QUEST DETAIL SCREEN
              // ----------------------------------------------------

              private void showQuest(
                      JSONObject quest) {

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(
                          true
                  );

                  scroll.setBackgroundColor(
                          Color.rgb(18,18,18)
                  );


                  LinearLayout root =
                          baseLayout();


                  // ------------------------------------------------
                  // BACK
                  // ------------------------------------------------

                  Button back =
                          new Button(this);

                  back.setText(
                          "← All quests"
                  );

                  back.setOnClickListener(
                          v -> showQuestList()
                  );

                  root.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );


                  // ------------------------------------------------
                  // TITLE
                  // ------------------------------------------------

                  addText(
                          root,
                          quest.optString(
                                  "title",
                                  "Quest"
                          ),
                          26,
                          true
                  );


                  // ------------------------------------------------
                  // META
                  // ------------------------------------------------

                  addText(
                          root,
                          "Difficulty: "
                                  + quest.optString(
                                          "difficulty",
                                          "—"
                                  )
                                  + "   •   Length: "
                                  + quest.optString(
                                          "length",
                                          "—"
                                  )
                                  + "   •   Quest points: "
                                  + quest.optInt(
                                          "qp",
                                          0
                                  ),
                          14,
                          false
                  );


                  // =================================================
                  // ITEMS NEEDED AT THE TOP
                  // =================================================

                  LinearLayout itemBox =
                          new LinearLayout(this);

                  itemBox.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  itemBox.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(10)
                  );

                  itemBox.setBackground(
                          background(
                                  Color.rgb(
                                          35,
                                          60,
                                          42
                                  ),
                                  14
                          )
                  );


                  addText(
                          itemBox,
                          "🧰 ITEMS NEEDED FOR THIS QUEST",
                          19,
                          true
                  );


                  ArrayList<String> items =
                          compileItems(
                                  quest
                          );


                  if (
                          items.isEmpty()
                  ) {

                      addText(
                              itemBox,
                              "No special items detected.",
                              14,
                              false
                      );

                  } else {

                      for (
                              String item :
                              items
                      ) {

                          addText(
                                  itemBox,
                                  "• " + item,
                                  14,
                                  false
                          );
                      }
                  }


                  root.addView(
                          itemBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );


                  // =================================================
                  // REQUIREMENTS
                  // =================================================

                  addText(
                          root,
                          "Requirements",
                          20,
                          true
                  );

                  addArray(
                          root,
                          quest.optJSONArray(
                                  "requirements"
                          )
                  );


                  // =================================================
                  // REWARDS
                  // =================================================

                  addText(
                          root,
                          "Rewards",
                          20,
                          true
                  );

                  addArray(
                          root,
                          quest.optJSONArray(
                                  "rewards"
                          )
                  );


                  // =================================================
                  // WALKTHROUGH
                  // =================================================

                  addText(
                          root,
                          "Full Walkthrough",
                          23,
                          true
                  );


                  JSONArray sections =
                          quest.optJSONArray(
                                  "walkthrough"
                          );


                  if (
                          sections != null
                  ) {

                      for (
                              int i = 0;
                              i < sections.length();
                              i++
                      ) {

                          JSONObject section =
                                  sections.getJSONObject(
                                          i
                                  );


                          addText(
                                  root,
                                  section.optString(
                                          "title",
                                          "Section "
                                                  + (i + 1)
                                  ),
                                  19,
                                  true
                          );


                          JSONArray steps =
                                  section.optJSONArray(
                                          "steps"
                                  );


                          if (
                                  steps == null
                          ) {

                              continue;
                          }


                          for (
                                  int j = 0;
                                  j < steps.length();
                                  j++
                          ) {

                              String step =
                                      steps.optString(
                                              j,
                                              ""
                                      ).trim();


                              // ------------------------------------
                              // ITEM LABEL
                              // ------------------------------------

                              if (
                                      isItemStep(
                                              step
                                      )
                              ) {

                                  TextView itemLabel =
                                          makeText(
                                                  "ITEM NEEDED",
                                                  12,
                                                  true
                                          );

                                  itemLabel.setTextColor(
                                          Color.rgb(
                                                  255,
                                                  220,
                                                  120
                                          )
                                  );

                                  itemLabel.setPadding(
                                          dp(12),
                                          dp(7),
                                          dp(12),
                                          0
                                  );


                                  root.addView(
                                          itemLabel,
                                          new LinearLayout.LayoutParams(
                                                  -1,
                                                  -2
                                          )
                                  );
                              }


                              // ------------------------------------
                              // STEP
                              // ------------------------------------

                              TextView stepView =
                                      makeText(
                                              (j + 1)
                                                      + ". "
                                                      + step,
                                              15,
                                              false
                                      );


                              stepView.setLineSpacing(
                                      0,
                                      1.08f
                              );


                              root.addView(
                                      stepView,
                                      new LinearLayout.LayoutParams(
                                              -1,
                                              -2
                                      )
                              );
                          }
                      }
                  }


                  // ------------------------------------------------
                  // FINISH
                  // ------------------------------------------------

                  TextView end =
                          makeText(
                                  "Quest walkthrough complete.",
                                  16,
                                  true
                          );

                  end.setPadding(
                          dp(12),
                          dp(25),
                          dp(12),
                          dp(20)
                  );


                  root.addView(
                          end,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          )
                  );


                  scroll.addView(
                          root
                  );


                  setContentView(
                          scroll
                  );


                  scroll.post(
                          () -> scroll.fullScroll(
                                  View.FOCUS_UP
                          )
                  );
              }


              // ----------------------------------------------------
              // REQUIREMENTS / REWARDS
              // ----------------------------------------------------

              private void addArray(
                      LinearLayout root,
                      JSONArray array) {

                  if (
                          array == null
                          || array.length() == 0
                  ) {

                      addText(
                              root,
                              "None listed.",
                              14,
                              false
                      );

                      return;
                  }


                  boolean found = false;


                  for (
                          int i = 0;
                          i < array.length();
                          i++
                  ) {

                      String value =
                              array.optString(
                                      i,
                                      ""
                              );


                      if (
                              value.equalsIgnoreCase(
                                      "See walkthrough"
                              )
                              || value.equalsIgnoreCase(
                                      "See quest walkthrough"
                              )
                      ) {

                          continue;
                      }


                      addText(
                              root,
                              "• " + value,
                              14,
                              false
                      );

                      found = true;
                  }


                  if (!found) {

                      addText(
                              root,
                              "See walkthrough.",
                              14,
                              false
                      );
                  }
              }


              // ----------------------------------------------------
              // BACK BUTTON
              // ----------------------------------------------------

              @Override
              public void onBackPressed() {

                  showQuestList();
              }
          }
          EOF


