import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.net.HttpURLConnection;
import java.net.URL;
import java.net.URLEncoder;
import java.util.Locale;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class MainActivity extends Activity {

    private final ExecutorService executor =
            Executors.newSingleThreadExecutor();

    private EditText itemSearch;
    private TextView priceResult;

    private static final String MAPPING_URL =
            "https://prices.runescape.wiki/api/v1/osrs/mapping";

    private static final String LATEST_URL =
            "https://prices.runescape.wiki/api/v1/osrs/latest";

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        createMainScreen();
    }

    private void createMainScreen() {

        ScrollView scrollView = new ScrollView(this);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(32, 45, 32, 40);
        root.setBackgroundColor(Color.rgb(16, 19, 26));

        TextView title = new TextView(this);
        title.setText("QuestMate");
        title.setTextSize(36);
        title.setTypeface(null, Typeface.BOLD);
        title.setTextColor(Color.WHITE);
        title.setGravity(Gravity.CENTER);

        TextView subtitle = new TextView(this);
        subtitle.setText("OSRS Quest & Item Companion");
        subtitle.setTextSize(17);
        subtitle.setTextColor(Color.LTGRAY);
        subtitle.setGravity(Gravity.CENTER);
        subtitle.setPadding(0, 10, 0, 30);

        Button questButton = new Button(this);
        questButton.setText("📖 Quest Guide");
        questButton.setTextSize(17);

        questButton.setOnClickListener(v -> showQuestGuide());

        TextView priceTitle = new TextView(this);
        priceTitle.setText("OSRS Item Price Checker");
        priceTitle.setTextSize(23);
        priceTitle.setTypeface(null, Typeface.BOLD);
        priceTitle.setTextColor(Color.WHITE);
        priceTitle.setPadding(0, 35, 0, 10);

        itemSearch = new EditText(this);
        itemSearch.setHint("Enter item name");
        itemSearch.setSingleLine(true);
        itemSearch.setTextColor(Color.WHITE);
        itemSearch.setHintTextColor(Color.GRAY);
        itemSearch.setPadding(20, 15, 20, 15);

        Button priceButton = new Button(this);
        priceButton.setText("💰 Check OSRS Price");
        priceButton.setTextSize(17);

        priceButton.setOnClickListener(v -> checkPrice());

        priceResult = new TextView(this);
        priceResult.setText("");
        priceResult.setTextSize(18);
        priceResult.setTextColor(Color.WHITE);
        priceResult.setPadding(10, 25, 10, 25);
        priceResult.setGravity(Gravity.CENTER);

        TextView info = new TextView(this);
        info.setText(
                "QuestMate\n\n" +
                "Quest guides and OSRS item prices in one simple app.\n\n" +
                "Price data is retrieved from the OSRS Wiki real-time prices service."
        );
        info.setTextSize(14);
        info.setTextColor(Color.LTGRAY);
        info.setPadding(10, 30, 10, 10);

        root.addView(title);
        root.addView(subtitle);
        root.addView(questButton);
        root.addView(priceTitle);
        root.addView(itemSearch);
        root.addView(priceButton);
        root.addView(priceResult);
        root.addView(info);

        scrollView.addView(root);

        setContentView(scrollView);
    }

    private void showQuestGuide() {

        final String[] quests = {
                "Cook's Assistant",
                "The Restless Ghost",
                "Sheep Shearer",
                "Rune Mysteries",
                "Romeo & Juliet",
                "Waterfall Quest"
        };

        AlertDialog.Builder builder =
                new AlertDialog.Builder(this);

        builder.setTitle("Quest Guide");

        builder.setItems(quests, (dialog, which) -> {

            switch (which) {

                case 0:
                    showQuestDetails(
                            "Cook's Assistant",
                            "Start: Cook in Lumbridge Castle\n\n" +
                            "Requirements: None\n\n" +
                            "Basic objectives:\n" +
                            "• Get an egg\n" +
                            "• Get a bucket of milk\n" +
                            "• Get some flour\n" +
                            "• Return the ingredients to the Cook"
                    );
                    break;

                case 1:
                    showQuestDetails(
                            "The Restless Ghost",
                            "Start: Father Aereck in Lumbridge Church\n\n" +
                            "Requirements: None\n\n" +
                            "Basic objective:\n" +
                            "Help the ghost in the Lumbridge graveyard " +
                            "find peace."
                    );
                    break;

                case 2:
                    showQuestDetails(
                            "Sheep Shearer",
                            "Start: Farmer Fred\n\n" +
                            "Requirements: None\n\n" +
                            "Basic objectives:\n" +
                            "• Shear sheep\n" +
                            "• Collect the wool\n" +
                            "• Spin the wool\n" +
                            "• Return the required wool to Farmer Fred"
                    );
                    break;

                case 3:
                    showQuestDetails(
                            "Rune Mysteries",
                            "Start: Duke Horacio in Lumbridge Castle\n\n" +
                            "Requirements: None\n\n" +
                            "Basic objective:\n" +
                            "Investigate the mysterious rune essence " +
                            "and help establish access to rune essence mining."
                    );
                    break;

                case 4:
                    showQuestDetails(
                            "Romeo & Juliet",
                            "Start: Romeo in Varrock\n\n" +
                            "Requirements: None\n\n" +
                            "Basic objective:\n" +
                            "Help Romeo and Juliet overcome their problems " +
                            "and complete their story."
                    );
                    break;

                case 5:
                    showQuestDetails(
                            "Waterfall Quest",
                            "Start: Almera near the Baxtorian Falls\n\n" +
                            "Requirements: Recommended combat preparation\n\n" +
                            "Basic objective:\n" +
                            "Explore the waterfall area and recover the " +
                            "treasure hidden within the waterfall."
                    );
                    break;
            }
        });

        builder.setNegativeButton("Close", null);

        builder.show();
    }

    private void showQuestDetails(String title, String details) {

        AlertDialog.Builder builder =
                new AlertDialog.Builder(this);

        builder.setTitle(title);
        builder.setMessage(details);

        builder.setPositiveButton("OK", null);

        builder.show();
    }

