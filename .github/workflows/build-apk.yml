name: Build QuestMate Items - Fixed

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. FIND WORKING QUESTMATE APK
      # ============================================================

      - name: Find QuestMate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input

          echo "=========================================="
          echo " FINDING WORKING QUESTMATE APK"
          echo "=========================================="

          # First look for an APK directly in the repository.

          if [ -f "QuestMate.apk" ]; then

            echo "Found QuestMate.apk in repository."

            cp QuestMate.apk input/QuestMate.apk

          else

            echo "QuestMate.apk not found in repository."
            echo "Searching previous GitHub Actions artifacts..."

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              -o artifacts.json

            ARTIFACT_ID=$(jq -r '
              [
                .artifacts[]
                | select(.expired == false)
                | select(
                    (.name | ascii_downcase | contains("questmate"))
                    and
                    (.name | ascii_downcase | contains("apk"))
                )
              ]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' artifacts.json)

            if [ -z "$ARTIFACT_ID" ]; then

              echo ""
              echo "=========================================="
              echo " ERROR"
              echo "=========================================="
              echo ""
              echo "No QuestMate APK was found."
              echo ""
              echo "You need either:"
              echo "QuestMate.apk in the repository root"
              echo "OR"
              echo "a previous QuestMate APK artifact."
              echo ""

              exit 1

            fi

            echo "Using artifact ID:"
            echo "$ARTIFACT_ID"

            curl -fsSL \
              -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o input/artifact.zip

            mkdir -p input/extracted

            unzip -o \
              input/artifact.zip \
              -d input/extracted

            FOUND_APK=$(find input/extracted \
              -type f \
              -iname "*.apk" \
              | head -n 1)

            if [ -z "$FOUND_APK" ]; then

              echo "ERROR: No APK was found inside artifact."

              find input/extracted \
                -type f \
                -print

              exit 1

            fi

            cp "$FOUND_APK" input/QuestMate.apk

          fi

          echo ""
          echo "Source APK:"
          ls -lh input/QuestMate.apk


      # ============================================================
      # 4. INSTALL APKTOOL
      # ============================================================

      - name: Install Apktool
        run: |
          set -e

          curl -fsSL \
            -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"

          echo "Apktool version:"

          java -jar apktool.jar --version


      # ============================================================
      # 5. DECODE APK
      #
      # IMPORTANT:
      #
      # We DO NOT use --no-res here.
      #
      # The previous workflow used --no-res and consequently left
      # AndroidManifest.xml in binary form.
      #
      # This normal decode converts it to XML so it can safely be
      # modified.
      #
      # --no-src keeps the existing DEX/code untouched.
      # ============================================================

      - name: Decode QuestMate APK
        run: |
          set -e

          rm -rf work

          mkdir -p work

          echo "Decoding APK..."

          java -jar apktool.jar d \
            --no-src \
            --force \
            input/QuestMate.apk \
            -o work/questmate

          echo ""
          echo "APK decoded successfully."


      # ============================================================
      # 6. CHECK MANIFEST
      # ============================================================

      - name: Check decoded manifest
        run: |
          set -e

          if [ ! -f "work/questmate/AndroidManifest.xml" ]; then

            echo "ERROR: AndroidManifest.xml was not decoded."

            exit 1

          fi

          echo "Manifest found."

          file work/questmate/AndroidManifest.xml

          echo ""
          echo "First lines of manifest:"
          head -n 30 work/questmate/AndroidManifest.xml


      # ============================================================
      # 7. CHECK QUEST DATABASE
      # ============================================================

      - name: Check quest database
        run: |
          set -e

          if [ ! -f "work/questmate/assets/quests.json" ]; then

            echo "ERROR: assets/quests.json was not found."

            echo ""
            echo "Assets directory:"

            find work/questmate/assets \
              -maxdepth 2 \
              -type f \
              -print

            exit 1

          fi

          echo "quests.json found."

          python3 -m json.tool \
            work/questmate/assets/quests.json \
            > /dev/null

          echo "quests.json is valid."


      # ============================================================
      # 8. COMPILE QUEST ITEMS
      #
      # Existing walkthroughs are preserved.
      #
      # Existing item references are preserved.
      #
      # The top-level items list receives the compiled entries.
      # ============================================================

      - name: Compile quest item lists
        run: |

          cat > work/compile_items.py <<'PY'
          import json
          import re

          PATH = "work/questmate/assets/quests.json"

          with open(PATH, "r", encoding="utf-8") as f:
              quests = json.load(f)

          item_words = [
              "gear",
              "equipment",
              "food",
              "runes",
              "rune",
              "teleport",
              "teleports",
              "necklace",
              "amulet",
              "talisman",
              "staff",
              "axe",
              "pickaxe",
              "harpoon",
              "spade",
              "hammer",
              "bucket",
              "jug",
              "vial",
              "potion",
              "antipoison",
              "antifire",
              "anti-fire",
              "weapon",
              "armour",
              "armor",
              "boots",
              "gloves",
              "cape",
              "ring",
              "shield",
              "helmet",
              "hat",
              "bow",
              "crossbow",
              "arrows",
              "arrow",
              "bolts",
              "bolt",
              "ammo",
              "ammunition",
              "dagger",
              "sword",
              "scimitar",
              "mace",
              "spear",
              "rod",
              "rods",
              "rope",
              "coins",
              "coin",
              "logs",
              "log",
              "coal",
              "ore",
              "knife",
              "needle",
              "thread",
              "chisel",
              "tinderbox",
              "lantern",
              "candle",
              "torch",
              "pot",
              "potato",
              "cake",
              "meat",
              "shark",
              "lobster",
              "monkfish",
              "karambwan",
              "prayer potion",
              "super restore",
              "stamina",
              "energy potion",
              "strength potion",
              "combat potion",
              "ranging potion",
              "magic potion",
              "tablet",
              "tablets",
              "fairy ring",
              "skills necklace",
              "games necklace",
              "ring of dueling",
              "xeric",
              "kharedst"
          ]

          action_starts = [
              "talk ",
              "speak ",
              "search ",
              "enter ",
              "kill ",
              "fight ",
              "cast ",
              "read ",
              "open ",
              "chop ",
              "solve ",
              "inspect ",
              "watch ",
              "return ",
              "go ",
              "travel ",
              "pickpocket ",
              "use ",
              "take ",
              "buy ",
              "mine ",
              "cook ",
              "light ",
              "climb ",
              "equip ",
              "withdraw ",
              "bank ",
              "dig ",
              "cut ",
              "complete ",
              "finish ",
              "start ",
              "locate ",
              "investigate ",
              "collect ",
              "pick ",
              "loot ",
              "head ",
              "walk ",
              "run ",
              "proceed ",
              "leave ",
              "defeat "
          ]

          def clean(value):
              value = str(value).strip()
              value = re.sub(r"\s+", " ", value)
              value = re.sub(r"[.!]+$", "", value)
              return value.strip()

          def key(value):
              return clean(value).lower()

          def is_action(value):
              low = key(value)

              for start in action_starts:
                  if low.startswith(start):
                      return True

              return False

          def is_item(value):

              value = clean(value)

              if not value:
                  return False

              if is_action(value):
                  return False

              low = value.lower()

              special = [
                  "any ",
                  "decent food",
                  "melee combat gear",
                  "ranged combat gear",
                  "magic combat gear",
                  "combat gear",
                  "melee or range gear",
                  "ranged or melee gear",
                  "melee or magic gear",
                  "magic or range gear",
                  "gear to",
                  "equipment to",
                  "runes/equipment",
                  "bring ",
                  "have ",
                  "bring at least ",
                  "you will need ",
                  "you'll need ",
                  "needed:",
                  "required:",
                  "recommended:",
                  "requires "
              ]

              for phrase in special:
                  if low.startswith(phrase):
                      return True

              for word in item_words:
                  if word in low:
                      return True

              return False

          def add(items, value):

              value = clean(value)

              if not value:
                  return

              ignored = {
                  "see walkthrough",
                  "see quest walkthrough",
                  "none",
                  "n/a"
              }

              if key(value) in ignored:
                  return

              existing = {
                  key(item)
                  for item in items
              }

              if key(value) not in existing:
                  items.append(value)

          for quest in quests:

              compiled = []

              # --------------------------------------------
              # Preserve existing top-level items.
              # --------------------------------------------

              existing = quest.get("items", [])

              if isinstance(existing, list):

                  for item in existing:

                      if isinstance(item, str):

                          if key(item) not in {
                              "see walkthrough",
                              "see quest walkthrough",
                              "none",
                              "n/a"
                          }:
                              add(compiled, item)

              # --------------------------------------------
              # Scan walkthrough sections.
              # --------------------------------------------

              walkthrough = quest.get("walkthrough", [])

              if isinstance(walkthrough, list):

                  for section in walkthrough:

                      if not isinstance(section, dict):
                          continue

                      steps = section.get("steps", [])

                      if not isinstance(steps, list):
                          continue

                      for step in steps:

                          if not isinstance(step, str):
                              continue

                          if is_item(step):
                              add(compiled, step)

              # --------------------------------------------
              # Never leave an empty list.
              # --------------------------------------------

              if not compiled:
                  compiled = ["See walkthrough"]

              quest["items"] = compiled

          with open(PATH, "w", encoding="utf-8") as f:

              json.dump(
                  quests,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

              f.write("\n")

          print("")
          print("==========================================")
          print(" COMPILED ITEMS")
          print("==========================================")

          for quest in quests[:20]:

              print("")
              print(quest.get("title", "Unknown quest"))

              for item in quest.get("items", []):
                  print("  •", item)

          print("")
          print("==========================================")
          PY

          python3 work/compile_items.py

          python3 -m json.tool \
            work/questmate/assets/quests.json \
            > /dev/null

          echo "Quest item compilation complete."


      # ============================================================
      # 9. CHANGE APPLICATION ID
      #
      # This makes the new APK a completely separate Android app.
      #
      # Original:
      #   whatever the original APK uses
      #
      # New:
      #   com.questmate.items
      #
      # Existing QuestMate can therefore remain installed.
      # ============================================================

      - name: Create separate QuestMate Items package
        run: |
          set -e

          MANIFEST="work/questmate/AndroidManifest.xml"

          echo "Reading decoded XML manifest..."

          python3 - <<'PY'
          import re

          path = "work/questmate/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # --------------------------------------------------------
          # Find original package.
          # --------------------------------------------------------

          match = re.search(
              r'<manifest\b[^>]*\bpackage\s*=\s*"([^"]+)"',
              text
          )

          if not match:

              print("Could not find package attribute.")
              print("")
              print(text[:3000])

              raise SystemExit(1)

          old_package = match.group(1)

          new_package = "com.questmate.items"

          print("Original package:")
          print(old_package)

          print("")
          print("New package:")
          print(new_package)

          # --------------------------------------------------------
          # Replace manifest package.
          # --------------------------------------------------------

          pattern = (
              r'(<manifest\b[^>]*\bpackage\s*=\s*")'
              + re.escape(old_package)
              + r'(")'
          )

          text, count = re.subn(
              pattern,
              r'\g<1>' + new_package + r'\g<2>',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Failed to replace manifest package."
              )

          # --------------------------------------------------------
          # Give the application a separate visible name.
          #
          # If the existing manifest has android:label, replace it.
          # Otherwise insert one.
          # --------------------------------------------------------

          label_pattern = (
              r'(android:label\s*=\s*")[^"]+(")'
          )

          if re.search(label_pattern, text):

              text = re.sub(
                  label_pattern,
                  r'\g<1>QuestMate Items\g<2>',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  "<application",
                  '<application android:label="QuestMate Items"',
                  1
              )

          # --------------------------------------------------------
          # Set a distinct version name/code.
          # --------------------------------------------------------

          version_code_pattern = (
              r'(android:versionCode\s*=\s*")[^"]+(")'
          )

          if re.search(version_code_pattern, text):

              text = re.sub(
                  version_code_pattern,
                  r'\g<1>3001\g<2>',
                  text,
                  count=1
              )

          version_name_pattern = (
              r'(android:versionName\s*=\s*")[^"]+(")'
          )

          if re.search(version_name_pattern, text):

              text = re.sub(
                  version_name_pattern,
                  r'\g<1>3.0-items\g<2>',
                  text,
                  count=1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("")
          print("Manifest successfully changed.")

          print("")
          print("New app:")
          print("QuestMate Items")

          print("")
          print("New package:")
          print("com.questmate.items")
          PY


      # ============================================================
      # 10. VERIFY MANIFEST
      # ============================================================

      - name: Verify separate package
        run: |
          set -e

          MANIFEST="work/questmate/AndroidManifest.xml"

          echo ""
          echo "=========================================="
          echo " FINAL MANIFEST CHECK"
          echo "=========================================="

          if ! grep -q 'package="com.questmate.items"' "$MANIFEST"; then

            echo "ERROR: New package was not found."

            exit 1

          fi

          if ! grep -q 'QuestMate Items' "$MANIFEST"; then

            echo "ERROR: QuestMate Items label was not found."

            exit 1

          fi

          echo ""
          echo "Package:"
          grep -o 'package="[^"]*"' "$MANIFEST" | head -n 1

          echo ""
          echo "QuestMate Items package verified."


      # ============================================================
      # 11. REBUILD APK
      # ============================================================

      - name: Rebuild QuestMate Items APK
        run: |
          set -e

          mkdir -p output

          echo "Rebuilding APK..."

          java -jar apktool.jar b \
            work/questmate \
            -o output/QuestMate-Items-unsigned.apk

          echo ""
          echo "Rebuild successful."

          ls -lh output/QuestMate-Items-unsigned.apk


      # ============================================================
      # 12. SET UP ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 13. INSTALL BUILD TOOLS
      # ============================================================

      - name: Install Android Build Tools
        run: |
          set -e

          yes | sdkmanager \
            "platform-tools" \
            "build-tools;36.0.0"

          echo "Android Build Tools installed."


      # ============================================================
      # 14. ZIPALIGN
      # ============================================================

      - name: Zipalign APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            output/QuestMate-Items-unsigned.apk \
            output/QuestMate-Items-aligned.apk

          echo "APK aligned."


      # ============================================================
      # 15. CREATE OR RESTORE TEST SIGNING KEY
      # ============================================================

      - name: Prepare signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p signing

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            -o signing/artifacts.json

          KEY_ID=$(jq -r '
            [
              .artifacts[]
              | select(.expired == false)
              | select(.name == "QuestMate-Items-Signing-Key")
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' signing/artifacts.json)

          if [ -n "$KEY_ID" ]; then

            echo "Existing QuestMate Items signing key found."

            curl -fsSL \
              -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${KEY_ID}/zip" \
              -o signing/key.zip

            mkdir -p signing/extracted

            unzip -o \
              signing/key.zip \
              -d signing/extracted

            FOUND_KEY=$(find signing/extracted \
              -type f \
              -name "*.keystore" \
              | head -n 1)

            if [ -z "$FOUND_KEY" ]; then

              echo "ERROR: Signing-key artifact is invalid."

              exit 1

            fi

            cp "$FOUND_KEY" \
              signing/questmate-items.keystore

            echo "Signing key restored."

          else

            echo "No previous signing key found."
            echo "Creating the first QuestMate Items key."

            keytool \
              -genkeypair \
              -v \
              -keystore signing/questmate-items.keystore \
              -alias questmateitems \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass questmateitems123 \
              -keypass questmateitems123 \
              -dname \
              "CN=QuestMate Items, OU=QuestMate, O=QuestMate, L=Brisbane, ST=QLD, C=AU"

            echo "New signing key created."

          fi


      # ============================================================
      # 16. SIGN APK
      # ============================================================

      - name: Sign QuestMate Items APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks signing/questmate-items.keystore \
            --ks-pass pass:questmateitems123 \
            --key-pass pass:questmateitems123 \
            --ks-key-alias questmateitems \
            --out output/QuestMate-Items.apk \
            output/QuestMate-Items-aligned.apk

          echo "APK signed."


      # ============================================================
      # 17. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            output/QuestMate-Items.apk

          echo ""
          echo "APK signature verified."


      # ============================================================
      # 18. VERIFY PACKAGE NAME
      # ============================================================

      - name: Verify final APK package
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo " FINAL APK INFORMATION"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            dump badging \
            output/QuestMate-Items.apk \
            | head -n 10

          echo ""
          echo "Expected package:"
          echo "com.questmate.items"

          echo ""
          echo "Expected app name:"
          echo "QuestMate Items"


      # ============================================================
      # 19. SHOW FINAL FILE
      # ============================================================

      - name: Check final APK
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo " BUILD COMPLETE"
          echo "=========================================="

          ls -lh output/QuestMate-Items.apk

          echo ""
          echo "QuestMate Items APK created successfully."


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================

      - name: Upload QuestMate Items APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-Items-Separate-App
          path: output/QuestMate-Items.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. SAVE SIGNING KEY
      #
      # This lets future builds update the same separate
      # QuestMate Items installation.
      # ============================================================

      - name: Save QuestMate Items signing key
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-Items-Signing-Key
          path: signing/questmate-items.keystore
          if-no-files-found: error
          retention-days: 90


      # ============================================================
      # 22. FINAL MESSAGE
      # ============================================================

      - name: Finished
        run: |
          echo ""
          echo "=============================================="
          echo "       QUESTMATE ITEMS IS READY"
          echo "=============================================="
          echo ""
          echo "Download artifact:"
          echo "QuestMate-Items-Separate-App"
          echo ""
          echo "APK:"
          echo "QuestMate-Items.apk"
          echo ""
          echo "Package:"
          echo "com.questmate.items"
          echo ""
          echo "App name:"
          echo "QuestMate Items"
          echo ""
          echo "It is designed to install alongside"
          echo "the original QuestMate."
          echo ""
          echo "=============================================="
