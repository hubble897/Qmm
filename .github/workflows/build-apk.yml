name: Build QuestMate Functional APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create QuestMate
        run: |
          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/questmate/app
          mkdir -p app/src/main/res/values

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "QuestMate"' \
          'include(":app")' \
          > settings.gradle

          printf '%s\n' \
          'plugins {' \
          '    id '\''com.android.application'\'' version '\''8.7.3'\'' apply false' \
          '}' \
          > build.gradle

          printf '%s\n' \
          'android.useAndroidX=true' \
          'android.enableJetifier=true' \
          > gradle.properties

          printf '%s\n' \
          'plugins {' \
          '    id '\''com.android.application'\''' \
          '}' \
          '' \
          'android {' \
          '    namespace '\''com.questmate.app'\''' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId '\''com.questmate.app'\''' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 2' \
          '        versionName '\''2.0'\''' \
          '    }' \
          '}' \
          > app/build.gradle

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <uses-permission android:name="android.permission.INTERNET" />' \
          '    <application' \
          '        android:allowBackup="false"' \
          '        android:label="QuestMate 2.0"' \
          '        android:theme="@style/AppTheme">' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:screenOrientation="portrait"' \
          '            android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:colorAccent">#4CAF50</item>' \
          '        <item name="android:statusBarColor">#10131A</item>' \
          '        <item name="android:navigationBarColor">#10131A</item>' \
          '    </style>' \
          '</resources>' \
          > app/src/main/res/values/styles.xml

          cat > app/src/main/java/com/questmate/app/MainActivity.java <<'EOF'
          package com.questmate.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private EditText itemSearch;
              private TextView result;
              private final ExecutorService executor =
                      Executors.newSingleThreadExecutor();

              private static final String MAPPING =
                      "https://prices.runescape.wiki/api/v1/osrs/mapping";

              private static final String LATEST =
                      "https://prices.runescape.wiki/api/v1/osrs/latest";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createScreen();
              }

              private void createScreen() {

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(25, 35, 25, 40);
                  root.setBackgroundColor(Color.rgb(16,19,26));

                  TextView title = new TextView(this);
                  title.setText("QuestMate");
                  title.setTextSize(38);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);

                 
