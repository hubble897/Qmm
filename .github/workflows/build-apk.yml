      # ============================================================
      # 9. BUILD APK
      # ============================================================
      - name: Build debug APK
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ============================================================
      # 10. VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not produced."
            find app/build -type f | sort || true
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/QuestMate-Complete.apk"

          echo ""
          echo "========================================"
          echo "QuestMate Complete APK created"
          echo "========================================"
          ls -lh release/QuestMate-Complete.apk


      # ============================================================
      # 11. UPLOAD EXACTLY ONE ARTIFACT
      # ============================================================
      - name: Upload QuestMate Complete APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-Complete
          path: release/QuestMate-Complete.apk
          if-no-files-found: error
          retention-days: 14
