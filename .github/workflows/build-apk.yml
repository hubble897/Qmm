name: Build QuestMate Complete APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build QuestMate Complete APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. FIND THE ORIGINAL QUESTMATE APK
      #
      # Preferred:
      #   QuestMate.apk in the repository root
      #
      # Fallback:
      #   Latest non-expired GitHub Actions artifact containing
      #   both "questmate" and "apk" in its name.
      # ============================================================
      - name: Locate QuestMate source APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p source_apk

          if [ -f "QuestMate.apk" ]; then
            echo "Found QuestMate.apk in repository root."
            cp "QuestMate.apk" "source_apk/QuestMate.apk"
          else
            echo "QuestMate.apk not found in repository root."
            echo "Searching previous GitHub Actions artifacts..."

            API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL" \
              -o artifacts.json

            python3 <<'PY'
            import json
            import sys

            with open("artifacts.json", "r", encoding="utf-8") as f:
                data = json.load(f)

            candidates = []

            for artifact in data.get("artifacts", []):
                name = artifact.get("name", "").lower()
                expired = artifact.get("expired", False)

                if not expired and "questmate" in name and "apk" in name:
                    candidates.append(artifact)

            candidates.sort(
                key=lambda x: x.get("created_at", ""),
                reverse=True
            )

            if not candidates:
                print("")
                print("ERROR: No QuestMate APK was found.")
                print("")
                print("Put the original QuestMate.apk in the repository root")
                print("and run this workflow again.")
                sys.exit(1)

            selected = candidates[0]

            print("Selected artifact:")
            print(selected.get("name"))
            print(selected.get("id"))

            with open("selected_artifact.txt", "w", encoding="utf-8") as f:
                f.write(str(selected["id"]))
            PY

            ARTIFACT_ID="$(cat selected_artifact.txt)"

            echo "Downloading artifact ${ARTIFACT_ID}..."

            curl -fsSL \
              -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o source_artifact.zip

            mkdir -p source_extract
            unzip -o source_artifact.zip -d source_extract

            FOUND_APK="$(find source_extract -type f -iname '*.apk' | head -n 1)"

            if [ -z "$FOUND_APK" ]; then
              echo "ERROR: Artifact did not contain an APK."
              exit 1
            fi

            cp "$FOUND_APK" "source_apk/QuestMate.apk"

            echo "Found source APK:"
            ls -lh source_apk/QuestMate.apk
          fi

          echo ""
          echo "Source APK:"
          ls -lh source_apk/QuestMate.apk


      # ============================================================
      # 6. EXTRACT QUEST DATABASE
      # ============================================================
      - name: Extract quests.json
        run: |
          set -e

          mkdir -p app/src/main/assets

          unzip -p source_apk/QuestMate.apk assets/quests.json \
            > app/src/main/assets/quests.json

          if [ ! -s app/src/main/assets/quests.json ]; then
            echo "ERROR: quests.json could not be extracted."
            exit 1
          fi

          python3 <<'PY'
          import json

          path = "app/src/main/assets/quests.json"

          with open(path, "r", encoding="utf-8") as f:
              quests = json.load(f)

          if not isinstance(quests, list):
              raise SystemExit("ERROR: quests.json is not an array")

          total_steps = 0

          for quest in quests:
              walkthrough = quest.get("walkthrough", [])

              if isinstance(walkthrough, list):
                  for section in walkthrough:
                      if isinstance(section, dict):
                          steps = section.get("steps", [])
                          if isinstance(steps, list):
                              total_steps += len(steps)

          print(f"Quest records: {len(quests)}")
          print(f"Walkthrough steps: {total_steps}")
          PY


      # ============================================================
      # 7. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        run: |
          set -e

          mkdir -p app/src/main/java/com/questmate/complete
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "QuestMateComplete"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.questmate.complete'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.questmate.complete'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE',
                          'META-INF/LICENSE.txt',
                          'META-INF/NOTICE',
                          'META-INF/NOTICE.txt'
                      ]
                  }
              }
          }
          EOF


          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="background">#101318</color>
              <color name="surface">#1A1F27</color>
              <color name="surface2">#232A34</color>
              <color name="text">#FFFFFF</color>
              <color name="secondary_text">#B9C0CA</color>
              <color name="accent">#7CB7FF</color>
              <color name="item_background">#29351F</color>
              <color name="item_text">#D7F5A8</color>
          </resources>
          EOF


          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0E12</item>
                  <item name="android:navigationBarColor">#0B0E12</item>
                  <item name="android:colorAccent">#7CB7FF</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="QuestMate Complete"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 8. CREATE MAIN ACTIVITY
      #
      # IMPORTANT:
      # This version deliberately uses optJSONObject/optJSONArray
      # instead of unchecked getJSONObject calls.
      #
      # That fixes the JSONException compilation error from the
      # previous workflow.
      # ============================================================
      - name: Create QuestMate Java application
        run: |
          cat > app/src/main/java/com/questmate/complete/MainActivity.java <<'EOF'
          package com.questmate.complete;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.content.Context;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              private final ArrayList<JSONObject> quests = new ArrayList<>();
              private final ArrayList<String> questTitles = new ArrayList<>();

              private LinearLayout root;
              private EditText searchBox;

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(dp(12), dp(8), dp(12), dp(8));
                  return t;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  return b;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(11, 14, 18));
                  getWindow().setNavigationBarColor(Color.rgb(11, 14, 18));

                  loadQuests();
                  showQuestList();
              }


              // ======================================================
              // LOAD DATABASE
              // ======================================================
              private void loadQuests() {

                  try {

                      InputStream input =
                              getAssets().open("quests.json");

                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              input,
                                              "UTF-8"
                                      )
                              );

                      StringBuilder jsonText =
                              new StringBuilder();

                      String line;

                      while ((line = reader.readLine()) != null) {
                          jsonText.append(line);
                      }

                      reader.close();

                      JSONArray array =
                              new JSONArray(jsonText.toString());

                      for (int i = 0; i < array.length(); i++) {

                          JSONObject quest =
                                  array.optJSONObject(i);

                          if (quest == null) {
                              continue;
                          }

                          quests.add(quest);

                          String title =
                                  quest.optString(
                                          "title",
                                          "Unknown Quest"
                                  );

                          questTitles.add(title);
                      }

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Could not load quest database.",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }


              // ======================================================
              // QUEST LIST
              // ======================================================
              private void showQuestList() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(16, 19, 24));

                  TextView header =
                          text(
                                  "QuestMate Complete",
                                  25,
                                  Color.WHITE
                          );

                  header.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  header.setPadding(
                          dp(16),
                          dp(18),
                          dp(16),
                          dp(10)
                  );

                  root.addView(header);


                  TextView subtitle =
                          text(
                                  quests.size()
                                          + " quests • Complete walkthroughs",
                                  14,
                                  Color.rgb(185, 192, 202)
                          );

                  root.addView(subtitle);


                  searchBox =
                          new EditText(this);

                  searchBox.setHint("Search quests...");
                  searchBox.setHintTextColor(
                          Color.rgb(150, 158, 170)
                  );
                  searchBox.setTextColor(Color.WHITE);
                  searchBox.setSingleLine(true);
                  searchBox.setPadding(
                          dp(14),
                          dp(4),
                          dp(14),
                          dp(4)
                  );

                  root.addView(
                          searchBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(55)
                          )
                  );


                  ListView list =
                          new ListView(this);

                  list.setBackgroundColor(
                          Color.rgb(16, 19, 24)
                  );

                  root.addView(
                          list,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<String>(
                                  this,
                                  android.R.layout.simple_list_item_1,
                                  new ArrayList<>(questTitles)
                          ) {

                              @Override
                              public View getView(
                                      int position,
                                      View convertView,
                                      ViewGroup parent
                              ) {

                                  TextView v =
                                          (TextView) super.getView(
                                                  position,
                                                  convertView,
                                                  parent
                                          );

                                  v.setTextColor(Color.WHITE);
                                  v.setTextSize(17);
                                  v.setPadding(
                                          dp(16),
                                          dp(15),
                                          dp(16),
                                          dp(15)
                                  );

                                  return v;
                              }
                          };


                  list.setAdapter(adapter);


                  list.setOnItemClickListener(
                          (parent, view, position, id) -> {

                              String selected =
                                      adapter.getItem(position);

                              for (JSONObject quest : quests) {

                                  if (quest.optString(
                                          "title",
                                          ""
                                  ).equals(selected)) {

                                      showQuest(quest);
                                      break;
                                  }
                              }
                          }
                  );


                  searchBox.addTextChangedListener(
                          new android.text.TextWatcher() {

                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {
                              }

                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {

                                  String query =
                                          s.toString()
                                                  .toLowerCase(
                                                          Locale.ROOT
                                                  );

                                  ArrayList<String> filtered =
                                          new ArrayList<>();

                                  for (String title : questTitles) {

                                      if (title
                                              .toLowerCase(
                                                      Locale.ROOT
                                              )
                                              .contains(query)) {

                                          filtered.add(title);
                                      }
                                  }

                                  adapter.clear();
                                  adapter.addAll(filtered);
                                  adapter.notifyDataSetChanged();
                              }

                              @Override
                              public void afterTextChanged(
                                      android.text.Editable s
                              ) {
                              }
                          }
                  );


                  setContentView(root);
              }


              // ======================================================
              // QUEST DETAIL
              // ======================================================
              private void showQuest(JSONObject quest) {

                  LinearLayout page =
                          new LinearLayout(this);

                  page.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  page.setBackgroundColor(
                          Color.rgb(16, 19, 24)
                  );


                  LinearLayout topBar =
                          new LinearLayout(this);

                  topBar.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  topBar.setPadding(
                          dp(6),
                          dp(5),
                          dp(6),
                          dp(5)
                  );

                  Button back =
                          button("← Quests");

                  back.setOnClickListener(
                          v -> showQuestList()
                  );

                  topBar.addView(back);


                  TextView title =
                          text(
                                  quest.optString(
                                          "title",
                                          "Quest"
                                  ),
                                  19,
                                  Color.WHITE
                          );

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  topBar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  page.addView(topBar);


                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(true);


                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  content.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(30)
                  );


                  // ==================================================
                  // QUEST INFORMATION
                  // ==================================================
                  addSectionTitle(
                          content,
                          "QUEST INFORMATION"
                  );

                  StringBuilder info =
                          new StringBuilder();

                  String difficulty =
                          quest.optString(
                                  "difficulty",
                                  ""
                          );

                  String length =
                          quest.optString(
                                  "length",
                                  ""
                          );

                  String members =
                          quest.optString(
                                  "members",
                                  ""
                          );

                  String qp =
                          quest.optString(
                                  "qp",
                                  ""
                          );

                  String start =
                          quest.optString(
                                  "start",
                                  ""
                          );

                  if (!difficulty.isEmpty()) {
                      info.append(
                              "Difficulty: "
                                      + difficulty
                                      + "\n"
                      );
                  }

                  if (!length.isEmpty()) {
                      info.append(
                              "Length: "
                                      + length
                                      + "\n"
                      );
                  }

                  if (!members.isEmpty()) {
                      info.append(
                              "Members: "
                                      + members
                                      + "\n"
                      );
                  }

                  if (!qp.isEmpty()) {
                      info.append(
                              "Quest Points: "
                                      + qp
                                      + "\n"
                      );
                  }

                  if (!start.isEmpty()) {
                      info.append(
                              "Start: "
                                      + start
                                      + "\n"
                      );
                  }

                  if (info.length() > 0) {
                      content.addView(
                              text(
                                      info.toString().trim(),
                                      15,
                                      Color.rgb(210, 215, 222)
                              )
                      );
                  }


                  // ==================================================
                  // ITEMS NEEDED
                  // ==================================================
                  addSectionTitle(
                          content,
                          "🧰 ITEMS NEEDED FOR THIS QUEST"
                  );


                  ArrayList<String> items =
                          compileItems(quest);


                  if (items.isEmpty()) {

                      TextView none =
                              text(
                                      "No specific items were identified in the quest database. Check the walkthrough below for requirements.",
                                      14,
                                      Color.rgb(185, 192, 202)
                              );

                      content.addView(none);

                  } else {

                      for (String item : items) {

                          TextView itemView =
                                  text(
                                          "• " + item,
                                          15,
                                          Color.rgb(215, 245, 168)
                                  );

                          itemView.setBackgroundColor(
                                  Color.rgb(41, 53, 31)
                          );

                          itemView.setPadding(
                                  dp(12),
                                  dp(10),
                                  dp(12),
                                  dp(10)
                          );

                          LinearLayout.LayoutParams lp =
                                  new LinearLayout.LayoutParams(
                                          -1,
                                          -2
                                  );

                          lp.setMargins(
                                  dp(4),
                                  dp(2),
                                  dp(4),
                                  dp(2)
                          );

                          content.addView(
                                  itemView,
                                  lp
                          );
                      }
                  }


                  // ==================================================
                  // REQUIREMENTS
                  // ==================================================
                  JSONArray requirements =
                          quest.optJSONArray(
                                  "requirements"
                          );

                  if (requirements != null
                          && requirements.length() > 0) {

                      addSectionTitle(
                              content,
                              "REQUIREMENTS"
                      );

                      addArray(
                              content,
                              requirements
                      );
                  }


                  // ==================================================
                  // COMBAT
                  // ==================================================
                  String combat =
                          quest.optString(
                                  "combat",
                                  ""
                          );

                  if (!combat.isEmpty()) {

                      addSectionTitle(
                              content,
                              "COMBAT"
                      );

                      content.addView(
                              text(
                                      combat,
                                      15,
                                      Color.rgb(220, 220, 220)
                              )
                      );
                  }


                  // ==================================================
                  // REWARDS
                  // ==================================================
                  JSONArray rewards =
                          quest.optJSONArray(
                                  "rewards"
                          );

                  if (rewards != null
                          && rewards.length() > 0) {

                      addSectionTitle(
                              content,
                              "REWARDS"
                      );

                      addArray(
                              content,
                              rewards
                      );
                  }


                  // ==================================================
                  // WALKTHROUGH
                  // ==================================================
                  addSectionTitle(
                          content,
                          "FULL WALKTHROUGH"
                  );


                  JSONArray walkthrough =
                          quest.optJSONArray(
                                  "walkthrough"
                          );


                  if (walkthrough == null
                          || walkthrough.length() == 0) {

                      content.addView(
                              text(
                                      "No walkthrough available.",
                                      15,
                                      Color.LTGRAY
                              )
                      );

                  } else {

                      int globalStep = 1;

                      for (int sectionIndex = 0;
                           sectionIndex < walkthrough.length();
                           sectionIndex++) {

                          JSONObject section =
                                  walkthrough.optJSONObject(
                                          sectionIndex
                                  );

                          if (section == null) {
                              continue;
                          }

                          String sectionTitle =
                                  section.optString(
                                          "title",
                                          ""
                                  );

                          if (!sectionTitle.isEmpty()) {

                              TextView sectionView =
                                      text(
                                              sectionTitle,
                                              18,
                                              Color.rgb(
                                                      124,
                                                      183,
                                                      255
                                              )
                                      );

                              sectionView.setTypeface(
                                      Typeface.DEFAULT,
                                      Typeface.BOLD
                              );

                              sectionView.setPadding(
                                      dp(8),
                                      dp(18),
                                      dp(8),
                                      dp(8)
                              );

                              content.addView(
                                      sectionView
                              );
                          }


                          JSONArray steps =
                                  section.optJSONArray(
                                          "steps"
                                  );

                          if (steps == null) {
                              continue;
                          }


                          for (int stepIndex = 0;
                               stepIndex < steps.length();
                               stepIndex++) {

                              String step =
                                      steps.optString(
                                              stepIndex,
                                              ""
                                      ).trim();

                              if (step.isEmpty()) {
                                  continue;
                              }


                              // --------------------------------------
                              // ITEM LABEL
                              // --------------------------------------
                              if (isItemStep(step)) {

                                  TextView itemLabel =
                                          text(
                                                  "ITEM NEEDED",
                                                  12,
                                                  Color.rgb(
                                                          215,
                                                          245,
                                                          168
                                                  )
                                          );

                                  itemLabel.setTypeface(
                                          Typeface.DEFAULT,
                                          Typeface.BOLD
                                  );

                                  itemLabel.setBackgroundColor(
                                          Color.rgb(
                                                  55,
                                                  72,
                                                  39
                                          )
                                  );

                                  itemLabel.setPadding(
                                          dp(10),
                                          dp(5),
                                          dp(10),
                                          dp(5)
                                  );

                                  LinearLayout.LayoutParams labelLp =
                                          new LinearLayout.LayoutParams(
                                                  -2,
                                                  -2
                                          );

                                  labelLp.setMargins(
                                          dp(4),
                                          dp(8),
                                          dp(4),
                                          dp(0)
                                  );

                                  content.addView(
                                          itemLabel,
                                          labelLp
                                  );
                              }


                              // --------------------------------------
                              // STEP
                              // --------------------------------------
                              TextView stepView =
                                      text(
                                              globalStep
                                                      + ". "
                                                      + step,
                                              15,
                                              Color.rgb(
                                                      235,
                                                      238,
                                                      242
                                              )
                                      );

                              stepView.setPadding(
                                      dp(10),
                                      dp(10),
                                      dp(10),
                                      dp(10)
                              );

                              LinearLayout.LayoutParams stepLp =
                                      new LinearLayout.LayoutParams(
                                              -1,
                                              -2
                                      );

                              stepLp.setMargins(
                                      dp(2),
                                      dp(1),
                                      dp(2),
                                      dp(1)
                              );

                              content.addView(
                                      stepView,
                                      stepLp
                              );

                              globalStep++;
                          }
                      }
                  }


                  TextView complete =
                          text(
                                  "✓ CONGRATULATIONS — QUEST COMPLETE",
                                  18,
                                  Color.rgb(215, 245, 168)
                          );

                  complete.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  complete.setGravity(
                          Gravity.CENTER
                  );

                  complete.setPadding(
                          dp(10),
                          dp(22),
                          dp(10),
                          dp(22)
                  );

                  content.addView(complete);


                  scroll.addView(content);

                  page.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );


                  setContentView(page);
              }


